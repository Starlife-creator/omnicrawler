# OmniCrawler pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff: lint + format (rev follows constraints/quality.txt for a reproducible
  # toolchain; a stale rev here would make local pre-commit disagree with CI).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy: type checking. Scope mirrors pyproject.toml: only apps/ is excluded
  # (gui/ and core/ are strict-mode per pyproject; excluding them here would make
  # local pre-commit weaker than CI, contradicting the "不得再宽松" note there).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        args: [--config-file=pyproject.toml]
        exclude: ^(src/omnicrawler/apps/|tests/)

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
      - id: requirements-txt-fixer

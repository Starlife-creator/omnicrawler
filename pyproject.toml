[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicrawler-platform"
# ⚠️ 版本号的唯一权威来源。构建脚本 (build_windows.ps1) 和 bump_version.py
#    都以此为据；不要手工修改此值，统一用 tools/bump_version.py 变更。
version = "0.9.1"
description = "从全类型网站采集、PDF解析/OCR到结构化导出和人工复核的模块化工作台"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}  # Phase 0 验收（第 81 轮用户决策）：AGPL-3.0 → Apache-2.0
authors = [{name = "Starlife-creator", email = "zqx666666@tutamail.com"}]
maintainers = [{name = "Starlife-creator", email = "zqx666666@tutamail.com"}]
dependencies = ["PyYAML>=6,<7", "defusedxml>=0.7,<1"]

[project.urls]
Homepage = "https://github.com/Starlife-creator/omnicrawler"
Repository = "https://github.com/Starlife-creator/omnicrawler"
Issues = "https://github.com/Starlife-creator/omnicrawler/issues"
Documentation = "https://github.com/Starlife-creator/omnicrawler/blob/main/README.md"

[project.optional-dependencies]
html = ["beautifulsoup4>=4.12,<5", "lxml>=5,<7", "cssselect>=1.2,<2", "selectolax>=0.2,<1"]
pdf = ["pypdfium2>=4.30,<6", "pdfplumber>=0.11,<1", "pypdf>=4,<7", "reportlab>=4,<6", "openpyxl>=3.1,<4"]
browser = ["playwright>=1.49,<2", "patchright>=1,<2"]
selenium = ["selenium>=4.27,<5"]
async-http = ["httpx>=0.27,<1"]
tls = ["curl_cffi>=0.11,<1"]
streams = ["websockets>=14,<18"]
distributed = ["redis>=5,<9"]
scrapy = ["Scrapy>=2.12,<3"]
ocr-tesseract = ["pytesseract>=0.3.13,<1", "Pillow>=10,<13"]
ocr-paddle = ["paddleocr[doc-parser]>=3.3,<4", "paddlepaddle>=3,<4", "numpy>=1.26,<3"]
ocr-captcha = ["ddddocr>=1.5,<2", "onnxruntime>=1.17,<2"]
crawl4ai = ["crawl4ai>=0.5,<1"]
gui = [
  "PySide6>=6.5,<7",
  "ruamel.yaml>=0.17,<1",
  "lxml>=5,<7",
  "openpyxl>=3.1,<4",
  "psutil>=5.9,<8",
  "requests>=2.28,<3",
]
dev = [
  "pytest>=8,<10",
  "coverage>=7,<8",
  "ruff>=0.12,<1",
  "mypy>=1.16,<3",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "pyinstaller>=6,<7",
  "tomli>=2,<3; python_version < '3.11'",
]
security = ["keyring>=25,<27", "cryptography>=44,<51"]
storage = ["boto3>=1.35,<2", "duckdb>=1.2,<2", "pyarrow>=18,<26"]
postgresql = ["psycopg[binary]>=3.2,<4"]
search = ["opensearch-py>=2.8,<4"]
document = [
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "chardet>=5,<8",
]
full = [
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "cssselect>=1.2,<2", "selectolax>=0.2,<1", "pypdfium2>=4.30,<6", "pdfplumber>=0.11,<1", "pypdf>=4,<7", "reportlab>=4,<6", "openpyxl>=3.1,<4",
  "playwright>=1.49,<2", "patchright>=1,<2", "selenium>=4.27,<5", "httpx>=0.27,<1",
  "websockets>=14,<18", "redis>=5,<9", "Scrapy>=2.12,<3",
  "pytesseract>=0.3.13,<1", "Pillow>=10,<13",
  "paddleocr[doc-parser]>=3.3,<4", "paddlepaddle>=3,<4", "numpy>=1.26,<3",
  "ddddocr>=1.5,<2", "onnxruntime>=1.17,<2",
  "crawl4ai>=0.5,<1",
  "PySide6>=6.5", "ruamel.yaml>=0.17", "psutil>=5.9", "requests>=2.28",
    "keyring>=25,<27", "cryptography>=44,<51",
    "boto3>=1.35,<2", "duckdb>=1.2,<2", "pyarrow>=18,<26",
    "psycopg[binary]>=3.2,<4", "opensearch-py>=2.8,<4",
    "curl_cffi>=0.11,<1",
    "aiofiles>=25,<26",
    "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "chardet>=5,<8",
]
# macOS Full：同 full，但去掉 paddleocr/paddlepaddle（macOS 无稳定 wheel），
# 显式补 opencv-contrib-python 供 cv2（macOS Full spec collect_all(cv2) 需要）。
# 用于 build_macos.sh --edition Full 的依赖矩阵。
full-macos = [
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "cssselect>=1.2,<2", "selectolax>=0.2,<1", "pypdfium2>=4.30,<6", "pdfplumber>=0.11,<1", "pypdf>=4,<7", "reportlab>=4,<6", "openpyxl>=3.1,<4",
  "playwright>=1.49,<2", "patchright>=1,<2", "selenium>=4.27,<5", "httpx>=0.27,<1",
  "websockets>=14,<18", "redis>=5,<9", "Scrapy>=2.12,<3",
  "pytesseract>=0.3.13,<1", "Pillow>=10,<13",
  "numpy>=1.26,<3", "opencv-contrib-python>=4.10,<6",
  "ddddocr>=1.5,<2", "onnxruntime>=1.17,<2",
  "crawl4ai>=0.5,<1",
  "PySide6>=6.5", "ruamel.yaml>=0.17", "psutil>=5.9", "requests>=2.28",
    "keyring>=25,<27", "cryptography>=44,<51",
    "boto3>=1.35,<2", "duckdb>=1.2,<2", "pyarrow>=18,<26",
    "psycopg[binary]>=3.2,<4", "opensearch-py>=2.8,<4",
    "curl_cffi>=0.11,<1",
    "aiofiles>=25,<26",
    "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "chardet>=5,<8",
]

[project.scripts]
omnicrawler = "omnicrawler.cli:main"
pdfx = "omnicrawler.pdfx.cli:main"
pdf-process = "omnicrawler.apps.pdf_processor:main"
pdf-extract = "omnicrawler.apps.field_extractor:main"
omnicrawler-workbench = "omnicrawler.services.workbench:main"
omnicrawler-gui = "omnicrawler.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnicrawler = ["templates/**/*.yaml", "templates/**/*.yml", "templates/**/*.csv", "templates/**/*.json", "data/*.yaml", "scenes/*.yaml"]
"omnicrawler.gui" = ["templates/*.yaml", "help/*.html", "help/images/*"]
# 注：locale 语言包不在此登记——pip wheel 形态经 data-files 打包需配套
# MANIFEST.in 与 Docker COPY，曾导致 docker/test CI 构建失败（2026-08-11）。
# 语言包随 PyInstaller 便携包分发（packaging/*.spec datas 已登记），
# 源码形态由 i18n._find_localedir 沿父链找到仓库根 locale/。

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: full workflow test that exercises real local services and external runtime adapters",
  "e2e_browser: optional local Chromium extension; never accesses a remote service",
  "asyncio: mark a test as an async test",
  "network: requires external network access; skipped by default, enable via env or -m network",
  "plugin_contract: public contract-2 test suite shared by authors and CI (F1: local green = CI green)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/omnicrawler"]
omit = ["src/omnicrawler/visual_selector/*"]  # Browser E2E tool — integration gate, not unit

[tool.coverage.report]
skip_covered = true
show_missing = true
# Phase 1 (2.3.0): baseline at 66% after subpackage splitting expanded total LOC.
# Target: 72% by next patch, 80% overall, 85% core by next minor release.
fail_under = 66

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "N"]
ignore = [
  "E501",     # line-too-long (handled by formatter)
  "E402",     # module-import-not-at-top (legacy compat)
  "E731",     # lambda-assignment (intentional)
  "N802",     # function-name-lowercase (some legacy names)
  "N803",     # argument-name-lowercase
  "N806",     # non-lowercase-variable-in-function
  "N815",     # mixed-case-variable-in-class-scope
  "N816",     # mixed-case-variable-in-global-scope
  "B904",     # raise-without-from-inside-except (intentional in some contexts)
  "B028",     # no-explicit-stacklevel (not all callers need this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "N815", "N816", "B018"]

[tool.ruff.lint.isort]
known-first-party = ["omnicrawler"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "^src/omnicrawler/(pdfx|apps)/"
disable_error_code = ["import-untyped"]

# Gradual GUI mypy inclusion — Phase 2 (2.3.0):
# gui/core is now fully strict (disallow_untyped_defs).
# Other GUI subdirectories remain at Phase 1 relaxed rules.
# Target: tighten widgets/ → views/ → wizard/ → runner/ → main/ → delegates/
# in subsequent phases.
[[tool.mypy.overrides]]
module = "omnicrawler.gui.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "omnicrawler.gui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false

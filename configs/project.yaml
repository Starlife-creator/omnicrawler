# 开箱验证配置。正式使用建议通过 `omnicrawler init` 创建独立文件。
project:
  name: 示例项目
  workspace: work/default
source:
  kind: static_html
  seeds: [https://example.com/]
crawl: {max_pages: 1, same_host: true}
http:
  user_agent: "OmniCrawler/1.0 (+contact: crawler@example.org)"
  respect_robots: true
  delay_seconds: 1.0
extract:
  mode: html
  fields:
    title: {selector: title}
    heading: {selector: h1}

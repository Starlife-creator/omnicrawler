        selector: ".absent-price"
      availability:
        selector: ".absent-availability"
    gene_seed: stale
    genes:
      price:
        # 旧版类名（实测 0 命中）
        - {selector: "p.product_main .price_color", selector_type: css}
        # 本任务**故意不给**可用候选：模拟「出厂基因全死」
        - {selector: "div.price_color", selector_type: css}
      availability:
        # 旧版类名（实测 0 命中）
        - {selector: "p.stock .availability", selector_type: css}

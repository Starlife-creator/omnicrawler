  # ── book-sharp-objects：候选全失效 ⇒ 期望 A == B
  - name: book-sharp-objects
    site: books.toscrape
    seeds:
      - https://books.toscrape.com/catalogue/sharp-objects_997/index.html
    source_kind: static_html
    identity_fields: [product_title]

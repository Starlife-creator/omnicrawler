project: {name: 示例项目-聚焦爬虫, workspace: work/focused}
source: {kind: focused, seeds: [https://example.com/]}
crawl:
  strategy: priority
  focus_keywords: [公告, 年度报告, 担保]
  max_pages: 200
  max_depth: 5
  same_host: true
http: {user_agent: "OmniCrawler/1.0 (+contact: crawler@example.org)", respect_robots: true, delay_seconds: 1.0}
extract: {mode: auto, fields: {title: {selector: title}, heading: {selector: h1}}}

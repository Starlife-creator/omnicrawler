version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # paddlex 3.7.2 精确锁 PyYAML==6.0.2；PIP_CONSTRAINT 全局作用于 matrix job 的
      # ".[full]" 安装，升级 PyYAML 必致 ResolutionImpossible（PR #47/#51/#53 三次复现）。
      - dependency-name: "PyYAML"
    groups:
      runtime:
        dependency-type: "production"
      dev:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/constraints"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # paddlex 3.7.2 精确锁 PyYAML==6.0.2；quality.txt 经 PIP_CONSTRAINT 作用于
      # windows-full-dependency-matrix 的 ".[full]" 安装，升级 PyYAML 必致
      # ResolutionImpossible（PR #47/#51 已两次复现），故永久忽略直至 paddlex 放宽。
      - dependency-name: "PyYAML"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

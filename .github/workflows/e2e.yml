name: end-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "tests/**"
      - "constraints/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "tests/**"
      - "constraints/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  e2e-linux:
    name: Linux Python 3.12 / Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_COVERAGE_TARGET: "95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # `pdf-write` 必须显式列出：`reportlab` 已从 `pdf` extra 拆出去
      # （见 pyproject.toml 条目 12 的说明 —— openpyxl/reportlab 服务的是
      # 「爬虫交付」与「生成 PDF」，不属于文档解析支柱）。
      # e2e 的 `test_local_crawl_pdf_extract_export_and_resume` 用
      # `create_pdf_bytes()` 生成测试 PDF，离不开 reportlab ——
      # 不列会报 `ModuleNotFoundError: No module named 'reportlab'`。
      - run: python -m pip install -e ".[html,pdf,pdf-write,browser,dev]"
      - run: python -m playwright install --with-deps chromium
      # 覆盖率口径：仅度量 e2e.harness 与 e2e.render_report（见 e2e/run.py --source），
      # 不代表应用代码覆盖率；E2E_TEST_REPORT.md 按同一口径标注，避免端到端覆盖误读。
      - run: bash e2e/run.sh --browser
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-python-3.12
          path: |
            docs/E2E_TEST_REPORT.md
            e2e-artifacts/
          if-no-files-found: warn

  gui-offscreen-smoke:
    # C-#12：三平台 GUI offscreen 冒烟矩阵占位。Windows/macOS 桌面链路此前无 E2E 兜底；
    # 当前先跑不依赖 Qt widget 的 GUI 纯逻辑用例，widget offscreen 套件待 CI 环境
    # 安装 Qt 运行时与窗口管理器后纳入本 job。continue-on-error: true 直至矩阵连续转绿，
    # 随后改为阻断。Python 固定 3.12（交付物冻结 3.12；3.13 不进本矩阵）。
    # 豁免到期：2027-03-31 —— 到期仍未转绿则必须在本 job 上显式续期（并说明卡在哪一步），
    # 否则 tests/unit/tools/test_ci_waiver_expiry.py 会判红；不允许无限期「占位」。
    name: GUI offscreen smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[html,gui,dev]"
      # `test_pdf_workbench_logic.py` 已随 PDF 工作台迁出为可选插件
      # （document-workbench，817bccc5 / 2026-11-17）。它在主仓已不存在 ——
      # 继续引用会让这个 step 报 `file or directory not found` 并令
      # 三平台 GUI smoke 全红（2026-11-22 实测）。这里只保留仍在主仓的。
      - name: Qt-free GUI logic smoke（widget offscreen 套件待 Qt 环境补齐）
        shell: bash
        run: python -m pytest -q -o faulthandler_timeout=300 tests/unit/gui/test_log_parser.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: warn

name: plugin-sandbox

# Phase 2a F3：插件子进程运行时契约与穿透矩阵（CI 分级）。
# - 双后端（源码 -I -S / 冻结宿主 exe 由 release 管线覆盖）跑同一套契约与穿透用例。
#   Linux 跑真实内核，macOS 跑真实 Seatbelt，Windows 保持明确未接线边界。
# - windows-latest AppContainer 探测 spike（诊断探针，第 73 轮）
# - AC 缺口口径（2026-10-29 校正）：第 74 轮设想的"skip + 缺口标注"从未落进用例，
#   而 spawn 前置裁决是 fail-closed —— runner 缺 AppContainer 时矩阵腿**判红**。
#   spike 本身仍不判红，只把探测/裁决结论打进日志供定位。
#
# 触发：插件运行时/契约相关代码变更；nightly 全量穿透矩阵（方案第 19 轮）。

on:
  push:
    branches: [main]
    paths:
      - "src/omnicrawler/plugins/**"
      - "packaging/OmniCrawler-SandboxHost.spec"
      - "tests/unit/plugin/**"
      - ".github/workflows/plugin-sandbox.yml"
  pull_request:
    paths:
      - "src/omnicrawler/plugins/**"
      - "packaging/OmniCrawler-SandboxHost.spec"
      - "tests/unit/plugin/**"
      - ".github/workflows/plugin-sandbox.yml"
  schedule:
    # nightly 穿透矩阵
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-matrix:
    name: 契约/穿透矩阵 (${{ matrix.os }} / Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" cryptography pyinstaller
      - name: 原生 Landlock ABI 最小调用
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat > /tmp/landlock-probe.c <<'C'
          #include <linux/landlock.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <errno.h>
          #include <stdint.h>
          int main(void) {
            long abi = syscall(__NR_landlock_create_ruleset, NULL, 0, 1);
            struct landlock_ruleset_attr attr = { .handled_access_fs = (1ULL << 13) - 1 };
            long fd = syscall(__NR_landlock_create_ruleset, &attr, sizeof(attr), 0);
            printf("native abi=%ld handled=%llu size=%zu fd=%ld errno=%d\n", abi, (unsigned long long)attr.handled_access_fs, sizeof(attr), fd, errno);
            if (fd >= 0) close(fd);
            struct landlock_ruleset_attr short_attr = { .handled_access_fs = (1ULL << 13) - 1 };
            fd = syscall(__NR_landlock_create_ruleset, &short_attr, 8, 0);
            printf("native short8 fd=%ld errno=%d\n", fd, errno);
            if (fd >= 0) close(fd);
            unsigned long long only = (1ULL << 13) - 1;
            fd = syscall(445, &only, 8, 0);
            printf("native bare8 fd=%ld errno=%d\n", fd, errno);
            if (fd >= 0) close(fd);
            return 0;
          }
          C
          cc /tmp/landlock-probe.c -o /tmp/landlock-probe
          /tmp/landlock-probe
        shell: bash
      - name: Python 最小 Landlock ABI 调用
        if: matrix.os == 'ubuntu-latest'
        run: |
          python - <<'PY'
          import ctypes
          class A(ctypes.Structure):
              _fields_ = [('handled_access_fs', ctypes.c_uint64)]
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          a = A(8191)
          print('syscall lookup', libc.syscall, ctypes.c_size_t(445).value)
          for size in (8, 24):
              ctypes.set_errno(0)
              fd = libc.syscall(ctypes.c_long(445), ctypes.c_void_p(ctypes.addressof(a)), ctypes.c_ulong(size), ctypes.c_ulong(0))
              print('python explicit', size, fd, ctypes.get_errno())
          libc.syscall.argtypes = [ctypes.c_long, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint]
          ctypes.set_errno(0)
          print('python typed', libc.syscall(445, ctypes.byref(a), 8, 0), ctypes.get_errno())
          ctypes.set_errno(0)
          print('python no-restype', libc.syscall(445, ctypes.byref(a), ctypes.c_size_t(8), ctypes.c_uint(0)), ctypes.get_errno())
          fn = getattr(libc, 'syscall')
          print('abi ptr size', ctypes.sizeof(ctypes.c_void_p), hex(ctypes.addressof(a)))
          for number in (444, 445):
              ctypes.set_errno(0)
              fd = fn(number, ctypes.byref(a), 8, 0 if number == 445 else 1)
              print('direct-number', number, fd, ctypes.get_errno())
          del libc.syscall.argtypes
          print('python system-getpid', libc.syscall(39), ctypes.get_errno())
          print('python lib', libc._name)
          print('raw bytes', bytes(fresh).hex() if 'fresh' in globals() else bytes(a).hex())
          fn2 = libc.syscall
          fn2.restype = ctypes.c_long
          fn2.argtypes = None
          x = A(8191)
          print('python fresh only', fn2(445, ctypes.byref(x), ctypes.c_size_t(8), ctypes.c_uint(0)), ctypes.get_errno())
          import os
          import struct
          import sys
          print('arch', os.uname().machine, 'size', struct.calcsize('Q'))
          libdl = ctypes.CDLL('libc.so.6', use_errno=True)
          libdl.syscall.restype = ctypes.c_long
          y = A(8191)
          print('python libc-explicit', libdl.syscall(445, ctypes.byref(y), ctypes.c_size_t(8), ctypes.c_uint(0)), ctypes.get_errno())
          print('python flags', ctypes.sizeof(A), ctypes.alignment(A))
          for arg in (ctypes.byref(y), ctypes.c_void_p(ctypes.addressof(y)), y):
              for number in (445,):
                  ctypes.set_errno(0)
                  fd = libdl.syscall(number, arg, 8, 0)
                  print('python variant', type(arg).__name__, fd, ctypes.get_errno())
          print('python getpid', libdl.syscall(39))
          libc.syscall.argtypes = None
          for value in (0, 1, 8191):
              z = A(value)
              ctypes.set_errno(0)
              print('clean call', value, libc.syscall(445, ctypes.byref(z), 8, 0), ctypes.get_errno())
          class Full(ctypes.Structure):
              _fields_ = [('handled_access_fs', ctypes.c_uint64), ('handled_access_net', ctypes.c_uint64), ('scoped', ctypes.c_uint64)]
          z = Full(8191, 0, 0)
          print('python full only', libc.syscall(445, ctypes.byref(z), 24, 0), ctypes.get_errno())
          import os
          print('nr values', os.sysconf_names.get('SC_PAGE_SIZE'))
          for number in (444, 445, 446):
              ctypes.set_errno(0)
              fd = libc.syscall(number, None, 0, 1)
              print('syscall version', number, fd, ctypes.get_errno())
          print('first syscall in fresh subprocess follows')
          for value in (0, 1, 0x1FFF):
              ctypes.set_errno(0)
              a.handled_access_fs = value
              print('python mask', value, libc.syscall(445, ctypes.byref(a), 8, 0), ctypes.get_errno())
          del libc.syscall.argtypes
          fresh = A(8191)
          for size in (8, 24):
              ctypes.set_errno(0)
              print('python fresh', size, libc.syscall(445, ctypes.byref(fresh), ctypes.c_size_t(size), ctypes.c_uint(0)), ctypes.get_errno())
          PY
        shell: bash
      - name: 真实内核与 Seatbelt 隔离用例
        run: python -m pytest tests/unit/plugin/test_unix_os_sandbox.py -q -p no:cacheprovider
        shell: bash
      # F1 公共契约夹具 + F2 差分 + 隔离/路由/适配器/broker 全套
      - name: 插件契约与穿透用例（源码后端）
        run: |
          python -m pytest tests/unit/plugin/test_sandbox_isolation.py \
            tests/unit/plugin/test_capability_broker.py \
            tests/unit/plugin/test_plugin_router.py \
            tests/unit/plugin/test_subprocess_adapter.py \
            tests/unit/plugin/test_contract_suite_example.py \
            tests/unit/plugin/test_differential_equivalence.py \
            -q -p no:cacheprovider
        shell: bash

  appcontainer-spike:
    name: Windows AppContainer 探测 spike（fail-fast 探针）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # 探针：**直接调用产品里的同一份探测**（此前此处自成一套 hasattr(advapi32, …)，
      # 查错导出模块 ⇒ 恒为 false，又因为不判红而长期没人核对，与 spawn 前置口径脱节）。
      # 按文件路径加载 plugin_os_sandbox.py（只用标准库）：本 job 不装包，走
      # `omnicrawler.plugins` 包名导入会经 __init__ 带出 PyYAML 而直接把探针跑崩。
      # 失败仅告警不红：矩阵腿才是门禁，这里只回答"这台 runner 到底有没有 AC"。
      - name: AppContainer 能力探测
        id: ac_probe
        env:
          # runner 默认 stdout 是 cp1252，打印中文 detail/reason 即 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
        run: |
          python - << 'PY'
          import importlib.util
          import os
          import sys

          spec = importlib.util.spec_from_file_location(
              "plugin_os_sandbox",
              os.path.join("src", "omnicrawler", "plugins", "plugin_os_sandbox.py"),
          )
          mod = importlib.util.module_from_spec(spec)
          # 先登记再执行：SandboxProbe 用 @dataclass(slots=True) + 延迟注解，
          # dataclasses 会按 cls.__module__ 回查 sys.modules，缺登记即 AttributeError。
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          probe = mod.probe_os_sandbox()
          mode, reason = mod.resolve_sandbox_mode()
          print(f"backend={probe.backend} available={probe.available} supported_range={probe.supported_range}")
          print(f"verdict={mode}")
          print(f"detail={probe.detail}")
          print(f"reason={reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ac_ok={'true' if probe.available else 'false'}\n")
              fh.write(f"verdict={mode}\n")
          PY
        shell: bash
      - name: 缺口标注（AC 不可用时）
        if: steps.ac_probe.outputs.ac_ok == 'false'
        run: |
          echo "::warning::windows-latest runner 探不到 AppContainer 导出（verdict=${{ steps.ac_probe.outputs.verdict }}）；spawn 前置 fail-closed 会让契约/穿透用例判红，请运行 plugins audit --report 反馈环境。"
        shell: bash

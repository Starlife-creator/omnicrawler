name: component-probe

# 组件快速验证（§15.6）——把「一轮约 45 分钟」压到「5–8 分钟」。
#
# ## 它解决什么
#
# 组件调试的反馈回路原本是：改代码 → push tag → 三平台 PyInstaller（约 40 分钟）
# → 冒烟 → 才知道哪一步坏了。v1.0.13→v1.0.29 那 17 轮里，大部分时间在等构建。
#
# ## ★ 复用产物的前提（维护者 2026-11-20 指出）
#
# 「这次优化了构建，那你直接复用上次构建产物，岂不是就测试不了你这次的结果了吗？」
#
# 完全正确。所以本工作流**先判断本轮改动是否触及构建链**：
#
#   - 触及构建链（spec / 打包脚本 / runtime_paths / 依赖锁 …） ⇒ **强制重建**
#   - 只在运行期/组件层（component_*.py / market 配方 / 测试 / 文档）⇒ 可复用
#   - **无法归类 ⇒ 保守重建**（宁可多花 40 分钟，也不给假的通过）
#
# 判断逻辑在 `tools/portable/needs_rebuild.py`，它把哪些路径算构建链写死成清单。
#
# ## ★ 为什么不给 `uses:` 的 job 写 `if`
#
# GitHub 在**解析阶段**就拒绝「`uses:` + `if:`」组合，表现为 `startup_failure`
# （没有任何日志，极难排查）。所以「要不要构建」的开关必须放进**被调用方内部**
# —— `reusable-build-linux.yml` 新增了 `run_build` 输入，由它自己的 job 级
# `if` 决定跑不跑。调用方只负责传值。
#
# ## 不消耗版本号
#
# 维护者 2026-11-20 裁定：**不拿版本号试错**。本工作流只用 `workflow_dispatch`，
# 不产生 tag、不创建 release。

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "对比基线（用于判断是否触及构建链）"
        required: false
        default: ""
        type: string
      force_build:
        description: "强制重新构建（忽略改动分类）"
        required: false
        default: false
        type: boolean

# ★ 必须声明 id-token / attestations：
#   被调用的 reusable-build-linux.yml 用它们做构建来源证明。
#   调用方不声明时，GitHub 在**解析阶段**就拒绝整个 workflow，
#   表现为 startup_failure 且 jobs=0（没有任何日志，极难排查）。
#   这一条是二分诊断 5 轮后才定位到的。
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: component-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PYTHON_VERSION: "3.13"
  PYTHONIOENCODING: utf-8

jobs:
  # ── 1) 判断能不能复用上次产物 ──────────────────────────────────────────
  decide:
    runs-on: ubuntu-22.04
    outputs:
      decision: ${{ steps.classify.outputs.decision }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"

      - name: 分类本轮改动
        id: classify
        # 注意：不要在本 step 内引用 steps.classify.outputs.* —— 那时刻还没写。
        # 真实的决策值由下一个 step 打印。
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          if [ "$FORCE_BUILD" = "true" ]; then
            { echo "decision=build"; echo "reason=手动要求强制重建"; } >> "$GITHUB_OUTPUT"
            echo "::notice::手动强制重建"
            exit 0
          fi
          BASE="${BASE_REF}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            { echo "decision=build"; echo "reason=没有可比基线，保守重建"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/portable/needs_rebuild.py \
            --base "$BASE" --head HEAD --github-output >> "$GITHUB_OUTPUT"

      - name: 打印本轮决策（独立 step，此时 output 已生效）
        run: |
          echo "::notice::决策=${{ steps.classify.outputs.decision }}"
          echo "::notice::理由=${{ steps.classify.outputs.reason }}"

  # ── 2a) 取最近一次成功 release 的产物（可复用时） ──────────────────────
  #
  # 这一步**总是尝试**，是否真的用得上由后续 probe 判断：
  # 拿不到就退回构建，不会静默跳过验证。
  fetch-last:
    needs: decide
    runs-on: ubuntu-22.04
    outputs:
      found: ${{ steps.dl.outputs.found }}
      run_id: ${{ steps.dl.outputs.run_id }}
    steps:
      - name: 下载最近一次 release 的 linux 产物
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "found=false" >> "$GITHUB_OUTPUT"
          # 找**任意**产出过 artifacts-linux 的成功运行 —— 不限于 release 工作流。
          # 现实情况：release 一直失败（v1.0.13→v1.0.29），如果只找 release，
          # reuse 路径永远不可用，每次都要重建，提速目的落空。
          # 退一步：任何成功且带该 artifact 的运行都能提供「一个可运行的产物」，
          # 而 reuse 的前提（本轮没改构建链）已由 decide 保证。
          # 按 workflow 名字过滤：只考虑**会产生产物**的那几个。
          # 直接扫全部成功运行没用 —— 最近的「成功」几乎都是 secret-scan /
          # license-gate 这类不构建的检查（实测 20 条里 0 条有产物）。
          # ★ 判据是「有没有产物」，不是「运行成不成功」。
          #
          # 现实：`component-probe` 从没成功过（它自己的 probe 步骤在失败），
          # 但它的 **build 子任务**是成功的，`artifacts-linux` 就在那里。
          # 按 `--status success` 筛会把这些合格的产物全漏掉。
          #
          # 安全性不变：reuse 的前提（本轮没改构建链）由 decide 保证；
          # 产物只要「能跑起来」就够用于组件验证 —— 而 build 子任务成功
          # 正是「能跑起来」的证据。
          RUN_ID=""
          for WF in component-probe release; do
            for CANDIDATE in $(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$WF" --limit 15 \
                --json databaseId --jq '.[].databaseId' 2>/dev/null); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE/artifacts" \
                  --jq '.artifacts[].name' 2>/dev/null | grep -qx 'artifacts-linux'; then
                RUN_ID="$CANDIDATE"
                echo "在 $WF 里找到带产物的运行：$CANDIDATE"
                break 2
              fi
            done
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::release 与 component-probe 里都没有带 artifacts-linux 的运行"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::warning::没有可复用的成功 release 运行"
            exit 0
          fi
          echo "候选复用运行：$RUN_ID"
          mkdir -p artifacts-linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n artifacts-linux -D artifacts-linux 2>/dev/null || true
          if [ -z "$(ls -A artifacts-linux 2>/dev/null)" ]; then
            echo "::warning::该运行没有 artifacts-linux"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          ls -la artifacts-linux

  # ── 2b) 构建（按 run_build 开关决定，默认不构建） ──────────────────────
  #
  # 复用成功时不构建；复用失败或改动触及构建链时必须构建。
  # `run_build` 的值由 decide + fetch-last 共同决定，但**不能写 if**
  # （见文件头说明），只能把结果作为输入传进去。
  build:
    needs: [decide, fetch-last]
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      build_python_version: "3.13"
      asset_max_bytes: "2039693706"
      delta_baselines: ""
      run_build: ${{ needs.decide.outputs.decision == 'build' || needs.fetch-last.outputs.found != 'true' }}

  # ── 3) 组件验证：装齐 + 照 smoke 跑 ───────────────────────────────────
  probe:
    needs: [decide, fetch-last, build]
    if: always() && (needs.build.result == 'success' || needs.fetch-last.outputs.found == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"

      - name: 记录本轮决策
        run: |
          echo "::notice::决策=${{ needs.decide.outputs.decision }}；理由=${{ needs.decide.outputs.reason }}"
          echo "::notice::复用产物 found=${{ needs.fetch-last.outputs.found }}；构建结果=${{ needs.build.result }}"

      - name: 下载产物（复用路径已下好则跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts-linux
          # ★ 三个 job 各有独立 workspace：fetch-last 下载的产物**不在**这里。
          #   必须按来源重新下载 —— 复用路径取 fetch-last 记下的 run_id，
          #   构建路径取本次运行。
          SOURCE_RUN="${{ needs.fetch-last.outputs.run_id }}"
          if [ -z "$SOURCE_RUN" ]; then
            SOURCE_RUN="$GITHUB_RUN_ID"
            echo "产物来源：本次运行（构建路径）$SOURCE_RUN"
          else
            echo "产物来源：复用运行 $SOURCE_RUN"
          fi
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            -n artifacts-linux -D artifacts-linux
          ls -la artifacts-linux

      - name: 解压 Standard 产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          shopt -s nullglob
          found=0
          for f in artifacts-linux/*Standard*.tar.xz; do
            echo "解压 $f"
            tar -xJf "$f" -C /tmp/release
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::artifacts-linux 里没有 Standard tar.xz"
            ls -la artifacts-linux
            exit 1
          fi
          echo "解压完成，共 $found 个归档"
          ls -la /tmp/release

      - name: 装齐市场组件并验证可运行
        shell: bash
        run: |
          set -euo pipefail
          # 定位 payload 根：优先找含 `omnicrawler` 可执行文件的目录，
          # 而不是猜目录名。tar 解出来的顶层名可能是 `OmniCrawler/`
          # 也可能带版本号，靠名字匹配容易失手（真实 CI 踩到过）。
          RELEASE_ROOT=""
          while IFS= read -r candidate; do
            if [ -x "$candidate/omnicrawler" ] || [ -x "$candidate/omnicrawler-cli" ] \
               || [ -f "$candidate/PORTABLE.flag" ]; then
              RELEASE_ROOT="$candidate"
              break
            fi
          done < <(find /tmp/release -maxdepth 3 -type d | sort)
          if [ -z "$RELEASE_ROOT" ]; then
            echo "::error::没有找到含可执行文件 / PORTABLE.flag 的产物根"
            echo "解压后的目录树："
            find /tmp/release -maxdepth 3 | head -40
            exit 1
          fi
          echo "release_root=$RELEASE_ROOT"
          ls -la "$RELEASE_ROOT" | head -20
          python tools/portable/verify_standard_components.py \
            "$RELEASE_ROOT" "$GITHUB_WORKSPACE/market" "component-probe"

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: component-probe-report
          path: "*.json"
          if-no-files-found: warn

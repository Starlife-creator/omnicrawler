name: component-probe

# 组件快速验证（§15.6）——把「一轮约 45 分钟」压到「5–8 分钟」。
#
# ## 它解决什么
#
# 组件调试的反馈回路原本是：改代码 → push tag → 三平台 PyInstaller（约 40 分钟）
# → 冒烟 → 才知道哪一步坏了。v1.0.13→v1.0.29 那 17 轮里，大部分时间在等构建。
#
# ## ★ 复用产物的前提（维护者 2026-11-20 指出）
#
# 「这次优化了构建，那你直接复用上次构建产物，岂不是就测试不了你这次的结果了吗？」
#
# 完全正确。所以本工作流**先判断本轮改动是否触及构建链**：
#
#   - 触及构建链（spec / 打包脚本 / runtime_paths / 依赖锁 …） ⇒ **强制重建**
#   - 只在运行期/组件层（component_*.py / market 配方 / 测试 / 文档）⇒ 可复用
#   - **无法归类 ⇒ 保守重建**（宁可多花 40 分钟，也不给假的通过）
#
# 判断逻辑在 `tools/portable/needs_rebuild.py`，它把哪些路径算构建链写死成清单。
#
# ## ★ 为什么不给 `uses:` 的 job 写 `if`
#
# GitHub 在**解析阶段**就拒绝「`uses:` + `if:`」组合，表现为 `startup_failure`
# （没有任何日志，极难排查）。所以「要不要构建」的开关必须放进**被调用方内部**
# —— `reusable-build-linux.yml` 新增了 `run_build` 输入，由它自己的 job 级
# `if` 决定跑不跑。调用方只负责传值。
#
# ## 不消耗版本号
#
# 维护者 2026-11-20 裁定：**不拿版本号试错**。本工作流只用 `workflow_dispatch`，
# 不产生 tag、不创建 release。

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "对比基线（用于判断是否触及构建链）"
        required: false
        default: ""
        type: string
      force_build:
        description: "强制重新构建（忽略改动分类）"
        required: false
        default: false
        type: boolean

# ★ 必须声明 id-token / attestations：
#   被调用的 reusable-build-linux.yml 用它们做构建来源证明。
#   调用方不声明时，GitHub 在**解析阶段**就拒绝整个 workflow，
#   表现为 startup_failure 且 jobs=0（没有任何日志，极难排查）。
#   这一条是二分诊断 5 轮后才定位到的。
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: component-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PYTHON_VERSION: "3.13"
  PYTHONIOENCODING: utf-8

jobs:
  # ── 1) 判断能不能复用上次产物 ──────────────────────────────────────────
  decide:
    runs-on: ubuntu-22.04
    outputs:
      decision: ${{ steps.classify.outputs.decision }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"

      - name: 分类本轮改动
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          if [ "$FORCE_BUILD" = "true" ]; then
            { echo "decision=build"; echo "reason=手动要求强制重建"; } >> "$GITHUB_OUTPUT"
            echo "::notice::手动强制重建"
            exit 0
          fi
          BASE="${BASE_REF}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            { echo "decision=build"; echo "reason=没有可比基线，保守重建"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/portable/needs_rebuild.py \
            --base "$BASE" --head HEAD --github-output >> "$GITHUB_OUTPUT"
          echo "::notice::决策=${{ steps.classify.outputs.decision }}"

  # ── 2a) 取最近一次成功 release 的产物（可复用时） ──────────────────────
  #
  # 这一步**总是尝试**，是否真的用得上由后续 probe 判断：
  # 拿不到就退回构建，不会静默跳过验证。
  fetch-last:
    needs: decide
    runs-on: ubuntu-22.04
    outputs:
      found: ${{ steps.dl.outputs.found }}
    steps:
      - name: 下载最近一次 release 的 linux 产物
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "found=false" >> "$GITHUB_OUTPUT"
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo '')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::没有可复用的成功 release 运行"
            exit 0
          fi
          echo "候选复用运行：$RUN_ID"
          mkdir -p artifacts-linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n artifacts-linux -D artifacts-linux 2>/dev/null || true
          if [ -z "$(ls -A artifacts-linux 2>/dev/null)" ]; then
            echo "::warning::该运行没有 artifacts-linux"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          ls -la artifacts-linux

  # ── 2b) 构建（按 run_build 开关决定，默认不构建） ──────────────────────
  #
  # 复用成功时不构建；复用失败或改动触及构建链时必须构建。
  # `run_build` 的值由 decide + fetch-last 共同决定，但**不能写 if**
  # （见文件头说明），只能把结果作为输入传进去。
  build:
    needs: [decide, fetch-last]
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      build_python_version: "3.13"
      asset_max_bytes: "2039693706"
      delta_baselines: ""
      run_build: ${{ needs.decide.outputs.decision == 'build' || needs.fetch-last.outputs.found != 'true' }}

  # ── 3) 组件验证：装齐 + 照 smoke 跑 ───────────────────────────────────
  probe:
    needs: [decide, fetch-last, build]
    if: always() && (needs.build.result == 'success' || needs.fetch-last.outputs.found == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"

      - name: 记录本轮决策
        run: |
          echo "::notice::决策=${{ needs.decide.outputs.decision }}；理由=${{ needs.decide.outputs.reason }}"
          echo "::notice::复用产物 found=${{ needs.fetch-last.outputs.found }}；构建结果=${{ needs.build.result }}"

      - name: 下载产物（复用路径已下好则跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts-linux
          if [ -n "$(ls -A artifacts-linux 2>/dev/null)" ]; then
            echo "已有产物（复用路径）"
          else
            # ★ 子 workflow 的 artifact 不会自动出现在调用方 workspace，必须显式下载
            echo "从本次运行下载 artifacts-linux"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n artifacts-linux -D artifacts-linux
          fi
          ls -la artifacts-linux

      - name: 解压 Standard 产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          shopt -s nullglob
          found=0
          for f in artifacts-linux/*Standard*.tar.xz; do
            echo "解压 $f"
            tar -xJf "$f" -C /tmp/release
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::error::artifacts-linux 里没有 Standard tar.xz"
            ls -la artifacts-linux
            exit 1
          fi
          ls -la /tmp/release

      - name: 装齐市场组件并验证可运行
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ROOT="$(find /tmp/release -maxdepth 2 -type d -name 'OmniCrawler*' | head -1)"
          if [ -z "$RELEASE_ROOT" ]; then
            RELEASE_ROOT="$(find /tmp/release -maxdepth 1 -mindepth 1 -type d | head -1)"
          fi
          if [ -z "$RELEASE_ROOT" ]; then
            echo "::error::没有找到解压后的 Standard 产物目录"
            exit 1
          fi
          echo "release_root=$RELEASE_ROOT"
          python tools/portable/verify_standard_components.py \
            "$RELEASE_ROOT" "$GITHUB_WORKSPACE/market" "component-probe"

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: component-probe-report
          path: "*.json"
          if-no-files-found: warn

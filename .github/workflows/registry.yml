name: registry

# git-as-registry 门禁：registry/ 是社区插件目录源（plugin.yaml + authors/ + keys/），
# catalog.json 是派生物。PR 修改 registry/ 时校验清单合法、与生成物一致、签名有效，
# 并演练"复制 registry/ 即独立仓库"（拆库成本 = 拷贝 + 改 catalog_url）。

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "registry/**"
  pull_request:
    paths:
      - "registry/**"

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[html]" cryptography ruff
      - name: 生态工具 lint（自包含工具随 registry/ 走）
        run: python -m ruff check registry/tools
      - name: Catalog 一致性 + 签名校验
        run: python registry/tools/generate_catalog.py --check
      - name: 生成物可被市场 CLI 消费
        run: python tools/market.py --catalog-url ./registry list
      - name: 拆库演练（registry/ 复制即独立仓库）
        run: |
          python -c "import shutil; shutil.copytree('registry', '/tmp/registry-standalone')"
          python /tmp/registry-standalone/tools/generate_catalog.py --check --registry /tmp/registry-standalone
          python tools/market.py --catalog-url /tmp/registry-standalone list

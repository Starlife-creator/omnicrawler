name: release

# 云端打包构建并发布：
#   - push v* tag（如 v0.7.0）→ 自动构建 Windows / Linux / macOS 便携包并发布正式 Release
#   - workflow_dispatch → 手动构建验证，只保留 Actions artifacts，不创建 GitHub Release
#
# 产物（每个平台包都含 SHA256SUMS 校验和 + SBOM + provenance）：
#   OmniCrawler-<version>-Windows-Portable-{Standard,Full}.zip
#   OmniCrawler-<version>-Linux-Portable-{Standard,Full}.tar.xz
#   OmniCrawler-<version>-macOS-Portable-{Standard,Full}.dmg
#   SHA256SUMS.txt / omnicrawler-sbom.cdx.json / omnicrawler-provenance.json
#
# 结构：三个平台构建 job 各自打包并上传 Actions artifact，聚合 release job
# 下载全部产物后统一发布到 GitHub Release（避免多 job 并发写同一 Release）。
#
# FINAL 发布闸门（三层漏斗）：
#   L0 构建门禁：任一平台 job 失败 ⇒ 聚合 job 不启动，发布不存在（needs 语义）
#   L1 尺寸预分类：各平台构建后本地比对 ASSET_MAX_BYTES（默认 1.9 GiB），
#      超限产物移出发布集并写入 SKIPPED-<platform>.txt 清单
#   L2 逐文件挂载：聚合期按文件循环上传——意外错误硬失败（先修再发），
#      仅"L1 已预判的超限缺席"允许降级；缺席自动写入 Release 说明

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# 单一来源：交付物冻结的 Python 版本。三平台构建 job 与聚合发布 job 均引用此值；
# verify-python-version job 会断言它与 pyproject 的 requires-python 下界一致，防止漂移。
env:
  BUILD_PYTHON_VERSION: "3.12"
  # FINAL 发布闸门阈值：单资产字节上限（≈1.9 GiB），低于 GitHub 硬限 2 GiB，
  # 为签名/计量误差留余量。超限产物在平台 job 内被移出发布集。
  ASSET_MAX_BYTES: "2039693706"

jobs:
  verify-python-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: constraints/quality.txt
      - name: 断言 requires-python 下界 == 构建 Python 版本
        shell: bash
        run: |
          PY_MIN=$(python -c "import tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['requires-python']; print(v.split('>=')[-1].split(',')[0].split('<')[0].strip())")
          BUILD_VER="${BUILD_PYTHON_VERSION}"
          if [ "$PY_MIN" != "$BUILD_VER" ]; then
            echo "::error::pyproject requires-python 下界 ($PY_MIN) 与构建 Python 版本 ($BUILD_VER) 不一致，请同步"
            exit 1
          fi
          echo "OK: requires-python 下界 $PY_MIN == 构建版本 $BUILD_VER"

      - name: 断言发布 tag == 项目版本
        if: github.event_name == 'push'
        shell: bash
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]; then
            echo "::error::发布 tag (${GITHUB_REF_NAME}) 与项目版本 ($EXPECTED_TAG) 不一致"
            exit 1
          fi
          echo "OK: 发布 tag ${GITHUB_REF_NAME} == 项目版本 $PROJECT_VERSION"

      - name: 安装快速门禁工具
        run: python -m pip install --constraint constraints/quality.txt ruff

      - name: 发布前快速门禁
        shell: bash
        run: |
          python -m compileall -q src tests examples tools
          python -m ruff check src tests tools
          python tools/check_release_integrity.py
          python tools/check_architecture.py
          python tools/check_docs_consistency.py
          python tools/check_network_boundaries.py --source-root src/omnicrawler

  build-windows-portable:
    needs: [verify-python-version]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 读取源码版本号
        id: version
        shell: pwsh
        run: |
          $version = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          Write-Output "version=$version"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      # 浏览器（Playwright Chromium）与 OCR 运行时（Tesseract/Paddle 模型）缓存，
      # 二次构建直接复用，避免每次从网络下载数百 MB。
      # P4-4：playwright 约束 >=1.49,<2 非精确锁，新次要版会换 Chromium revision；
      # 缓存 key 纳入实际解析的 playwright 版本，防旧版 Chromium 缓存与新版冲突。
      - name: 解析 playwright 版本（缓存 key）
        id: playwright-version
        shell: pwsh
        run: |
          python -m pip install "playwright>=1.49,<2" --quiet
          $v = (& python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))").Trim()
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
      - name: 缓存浏览器运行时
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: 缓存 OCR 运行时
        id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/runtime
          key: ocr-runtime-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('tools/prepare_windows_runtime.ps1', 'tools/download_and_smoke_test.py') }}

      # ── Standard 便携包 ────────────────────────────────────────────
      # 首次构建（无浏览器缓存）走联网下载；命中缓存则跳过下载直接复制。
      - name: 构建 Standard 便携包
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: |
          $browserArgs = @("-BrowserCachePath", ".cache/playwright")
          $cachedChrome = Get-ChildItem ".cache/playwright" -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cachedChrome) { $browserArgs += "-SkipBrowserDownload" }
          powershell -ExecutionPolicy Bypass -File build_windows.ps1 `
            -Edition Standard `
            -ReleaseOutputPath "$env:RUNNER_TEMP/artifacts" `
            -SkipRuntimeAssetDownload @browserArgs

      # ── Full 便携包 ────────────────────────────────────────────────
      - name: 构建 Full 便携包
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: |
          $browserArgs = @("-BrowserCachePath", ".cache/playwright")
          $cachedChrome = Get-ChildItem ".cache/playwright" -Recurse -Filter "chrome.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cachedChrome) { $browserArgs += "-SkipBrowserDownload" }
          $runtimeArgs = @("-RuntimeCachePath", ".cache/runtime")
          $runtimeManifest = ".cache/runtime/models/paddlex/omnicrawler-model-manifest.json"
          $cachedRuntime = (Test-Path $runtimeManifest) -and (Test-Path ".cache/runtime/tesseract/tesseract.exe") -and (Test-Path ".cache/runtime/selenium/chromedriver.exe")
          if ($cachedRuntime) { $runtimeArgs += "-SkipRuntimeAssetDownload" }
          powershell -ExecutionPolicy Bypass -File build_windows.ps1 `
            -Edition Full `
            -ReleaseOutputPath "$env:RUNNER_TEMP/artifacts" `
            @browserArgs @runtimeArgs

      # ── FINAL L1 尺寸预分类：超限产物移出发布集 ───────────────────
      - name: 尺寸预分类（超限移出，写缺席清单）
        shell: pwsh
        run: |
          $max = [int64]'${{ env.ASSET_MAX_BYTES }}'
          $skippedDir = Join-Path $env:RUNNER_TEMP "skipped-windows"
          New-Item -ItemType Directory -Force -Path $skippedDir | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/artifacts" -File |
            Where-Object { $_.Name -notlike "SKIPPED-*" } |
            ForEach-Object {
              if ($_.Length -gt $max) {
                Move-Item $_.FullName (Join-Path $skippedDir $_.Name)
                $line = "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
                Add-Content -Path "$env:RUNNER_TEMP/artifacts/SKIPPED-windows.txt" `
                  -Value $line -Encoding utf8
                Write-Output "::warning::产物超过发布上限，已从发布集剔除: $line"
              }
            }
          if (Test-Path "$env:RUNNER_TEMP/artifacts/SKIPPED-windows.txt") {
            Write-Output "── 缺席清单 ──"
            Get-Content "$env:RUNNER_TEMP/artifacts/SKIPPED-windows.txt"
          } else {
            Write-Output "全部产物在发布尺寸限制内"
          }

      # ── 发布元数据（SBOM / provenance / 校验和）────────────────────
      # SBOM/provenance/checksums 依赖包元数据（omnicrawler-platform.requires 与
      # 各依赖的已装版本）；系统 python 是全新环境，先安装元数据依赖集。
      # 三平台各自生成带平台后缀的 SBOM 与校验和；provenance 由聚合发布
      # job 统一生成（覆盖全部产物）。
      - name: 安装发布元数据依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[html,pdf,browser,async-http]"

      - name: 生成 SBOM
        shell: pwsh
        run: python tools/generate_sbom.py --output "$env:RUNNER_TEMP/artifacts/omnicrawler-sbom-windows.cdx.json"

      - name: 生成并校验 SHA-256 清单
        shell: pwsh
        run: |
          python tools/generate_checksums.py "$env:RUNNER_TEMP/artifacts" `
            --output "$env:RUNNER_TEMP/artifacts/SHA256SUMS-windows.txt" --verify
          python tools/generate_checksums.py "$env:RUNNER_TEMP/artifacts" `
            --output "$env:RUNNER_TEMP/artifacts/SHA256SUMS-windows.txt" --check

      # ── keyless 签名证明（Sigstore / gh attestation）────────────────
      # 不需要任何私钥：签名身份 = 本 release.yml 在 tag 上由 GitHub OIDC 背书，
      # 证明存于 GitHub 证明库，用户用 `gh attestation verify <包> --owner Starlife-creator` 核验。
      - name: 为便携包生成 keyless 签名证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # FINAL L1：glob 匹配现存归档——超限被剔除的产物自动不参与签名证明
          subject-path: |
            ${{ runner.temp }}/artifacts/OmniCrawler-*Portable-*.zip
          predicate-type: "https://in-toto.io/attestation/release/v0.1"
          predicate: "{}"

      - name: 列出构建产物
        shell: pwsh
        run: Get-ChildItem "$env:RUNNER_TEMP/artifacts" | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物（供聚合发布 job 使用）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-windows
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 1

  # ── Linux 便携包（Standard + Full，tar.xz）────────────────────────
  build-linux-portable:
    needs: [verify-python-version]
    # S6：固定 runner 版本——ubuntu-latest 漂移会改变 glibc（当前 24.04/glibc 2.39），
    # 高版本构建机产出的 onedir 在旧系统（glibc<2.39）跑不了。ubuntu-22.04（glibc 2.35）
    # 覆盖 Ubuntu 22.04+ / Debian 12+ / RHEL 9。
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装 Qt6 运行库（GUI 冒烟测试依赖，P4 跨平台对称）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-shape0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 libxcb-glx0

      - name: 解析 playwright 版本（缓存 key，P4-4）
        id: playwright-version
        run: |
          python -m pip install "playwright>=1.49,<2" --quiet
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: 缓存浏览器运行时
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/playwright
          key: playwright-linux-${{ steps.playwright-version.outputs.version }}

      - name: 构建 Standard 便携包
        shell: bash
        run: |
          browserArgs=()
          if [ -d ".cache/playwright" ]; then
            browserArgs=(--browser-cache-path .cache/playwright)
          fi
          bash build_linux.sh --edition Standard \
            --release-output "$RUNNER_TEMP/artifacts-linux" "${browserArgs[@]}"

      - name: 构建 Full 便携包
        shell: bash
        run: |
          browserArgs=()
          if [ -d ".cache/playwright" ]; then
            browserArgs=(--browser-cache-path .cache/playwright)
          fi
          bash build_linux.sh --edition Full \
            --release-output "$RUNNER_TEMP/artifacts-linux" "${browserArgs[@]}"

      # ── FINAL L1 尺寸预分类：超限产物移出发布集 ───────────────────
      - name: 尺寸预分类（超限移出，写缺席清单）
        shell: bash
        run: |
          set -euo pipefail
          max="${ASSET_MAX_BYTES}"
          skipped_dir="$RUNNER_TEMP/skipped-linux"
          mkdir -p "$skipped_dir"
          shopt -s nullglob
          for f in "$RUNNER_TEMP/artifacts-linux"/*; do
            base="$(basename "$f")"
            case "$base" in SKIPPED-*) continue ;; esac
            size=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "$f")
            if [ "$size" -gt "$max" ]; then
              mv "$f" "$skipped_dir/$base"
              line=$(printf '%s  %.1f MB' "$base" "$(echo "scale=1; $size/1048576" | bc)")
              echo "$line" >> "$RUNNER_TEMP/artifacts-linux/SKIPPED-linux.txt"
              echo "::warning::产物超过发布上限，已从发布集剔除: $line"
            fi
          done
          if [ -f "$RUNNER_TEMP/artifacts-linux/SKIPPED-linux.txt" ]; then
            echo "── 缺席清单 ──"; cat "$RUNNER_TEMP/artifacts-linux/SKIPPED-linux.txt"
          else
            echo "全部产物在发布尺寸限制内"
          fi

      - name: 生成 SBOM 与校验和
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[html,pdf,browser,async-http]"
          python tools/generate_sbom.py --output "$RUNNER_TEMP/artifacts-linux/omnicrawler-sbom-linux.cdx.json"
          python tools/generate_checksums.py "$RUNNER_TEMP/artifacts-linux" \
            --output "$RUNNER_TEMP/artifacts-linux/SHA256SUMS-linux.txt" --verify
          python tools/generate_checksums.py "$RUNNER_TEMP/artifacts-linux" \
            --output "$RUNNER_TEMP/artifacts-linux/SHA256SUMS-linux.txt" --check

      - name: 为便携包生成 keyless 签名证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/artifacts-linux/OmniCrawler-*Portable-*.tar.xz
          predicate-type: "https://in-toto.io/attestation/release/v0.1"
          predicate: "{}"

      - name: 上传构建产物（供聚合发布 job 使用）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-linux
          path: ${{ runner.temp }}/artifacts-linux/*
          if-no-files-found: error
          retention-days: 1

  # ── macOS 便携包（Standard + Full，dmg / tar.gz）──────────────────
  build-macos-portable:
    needs: [verify-python-version]
    # 固定 runner 镜像版本：macos-latest 漂移会导致 PyInstaller 在 macOS 上
    # 非确定性失败（PYI-9229/2508 Failed to load Python shared library），
    # 相同代码+依赖一轮过一轮挂。macos-14 为稳定镜像。
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Homebrew 新版要求 tap trust；runner 预装的 aws/tap 与本项目无关
      # （只用到 core tap 的 python@3.12/tesseract），移除它消除无关警告。
      - name: 移除无关的 aws/tap（Homebrew tap trust 警告）
        run: brew untap aws/tap 2>/dev/null || true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 解析 playwright 版本（缓存 key，P4-4）
        id: playwright-version
        run: |
          python -m pip install "playwright>=1.49,<2" --quiet
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: 缓存浏览器运行时
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/playwright
          key: playwright-macos-${{ steps.playwright-version.outputs.version }}

      - name: 构建 Standard 便携包
        shell: bash
        run: |
          browserArgs=()
          if [ -d ".cache/playwright" ]; then
            browserArgs=(--browser-cache-path .cache/playwright)
          fi
          bash build_macos.sh --edition Standard \
            --release-output "$RUNNER_TEMP/artifacts-macos" "${browserArgs[@]}"

      - name: 构建 Full 便携包
        shell: bash
        run: |
          browserArgs=()
          if [ -d ".cache/playwright" ]; then
            browserArgs=(--browser-cache-path .cache/playwright)
          fi
          bash build_macos.sh --edition Full \
            --release-output "$RUNNER_TEMP/artifacts-macos" "${browserArgs[@]}"

      # ── FINAL L1 尺寸预分类：超限产物移出发布集 ───────────────────
      - name: 尺寸预分类（超限移出，写缺席清单）
        shell: bash
        run: |
          set -euo pipefail
          max="${ASSET_MAX_BYTES}"
          skipped_dir="$RUNNER_TEMP/skipped-macos"
          mkdir -p "$skipped_dir"
          shopt -s nullglob
          for f in "$RUNNER_TEMP/artifacts-macos"/*; do
            base="$(basename "$f")"
            case "$base" in SKIPPED-*) continue ;; esac
            size=$(python -c "import os,sys; print(os.path.getsize(sys.argv[1]))" "$f")
            if [ "$size" -gt "$max" ]; then
              mv "$f" "$skipped_dir/$base"
              line=$(printf '%s  %.1f MB' "$base" "$(echo "scale=1; $size/1048576" | bc)")
              echo "$line" >> "$RUNNER_TEMP/artifacts-macos/SKIPPED-macos.txt"
              echo "::warning::产物超过发布上限，已从发布集剔除: $line"
            fi
          done
          if [ -f "$RUNNER_TEMP/artifacts-macos/SKIPPED-macos.txt" ]; then
            echo "── 缺席清单 ──"; cat "$RUNNER_TEMP/artifacts-macos/SKIPPED-macos.txt"
          else
            echo "全部产物在发布尺寸限制内"
          fi

      - name: 生成 SBOM 与校验和
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[html,pdf,browser,async-http]"
          python tools/generate_sbom.py --output "$RUNNER_TEMP/artifacts-macos/omnicrawler-sbom-macos.cdx.json"
          python tools/generate_checksums.py "$RUNNER_TEMP/artifacts-macos" \
            --output "$RUNNER_TEMP/artifacts-macos/SHA256SUMS-macos.txt" --verify
          python tools/generate_checksums.py "$RUNNER_TEMP/artifacts-macos" \
            --output "$RUNNER_TEMP/artifacts-macos/SHA256SUMS-macos.txt" --check

      - name: 为便携包生成 keyless 签名证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/artifacts-macos/OmniCrawler-*Portable-*.dmg
          predicate-type: "https://in-toto.io/attestation/release/v0.1"
          predicate: "{}"

      - name: 上传构建产物（供聚合发布 job 使用）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-macos
          path: ${{ runner.temp }}/artifacts-macos/*
          if-no-files-found: error
          retention-days: 1

  # ── 聚合发布：下载三平台产物，统一生成 provenance 并发布 ──────────
  release:
    needs: [build-windows-portable, build-linux-portable, build-macos-portable]
    # S6：聚合 job 与构建 job 同锁，保持环境一致（虽然只下载+发布，不产二进制）
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 生成 provenance
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[html,pdf,browser,async-http]"
          python tools/generate_provenance.py --artifact-dir "$RUNNER_TEMP/artifacts" \
            --output "$RUNNER_TEMP/artifacts/omnicrawler-provenance.json"

      # B14-💭-3：供应链完整性检查固化为 release 必跑步骤（任一失败 → 发布中止）。
      # SBOM ⊆ pip freeze 门禁的前提是"同一环境"：本聚合 job（ubuntu-22.04 +
      # 3.12 + .[html,pdf,browser,async-http]）与 Linux 构建 job 的 SBOM 生成
      # 环境完全一致，故比对 Linux SBOM。Windows/macOS SBOM 生成于不同平台，
      # 跨平台比对会因 runner 预装包差异误报（release run 32264465809 根因之一）。
      - name: 供应链完整性检查（B14 强制）
        shell: bash
        run: |
          python tools/check_network_boundaries.py --source-root src/omnicrawler
          python tools/check_guardrails.py \
            --sbom "$RUNNER_TEMP/artifacts/omnicrawler-sbom-linux.cdx.json"
          python tools/check_release_integrity.py . \
            --portable-zip-dir "$RUNNER_TEMP/artifacts"
          # P5：Linux tar.xz 容器级深校验（聚合期兜底；macOS 主产物是 dmg，
          # 其回退 tar.gz 已在 build_macos.sh 内做 mac 平台深校验，此处不重复）
          for archive in "$RUNNER_TEMP"/artifacts/*Linux-Portable-*.tar.xz; do
            [ -e "$archive" ] || continue
            python tools/check_release_integrity.py . \
              --portable-tar "$archive" --portable-platform linux --portable-deep
          done

      - name: 列出全部构建产物
        shell: bash
        run: ls -lh "$RUNNER_TEMP/artifacts"

      # 阶段 C-11：Linux GPG detached 签名（行业标配，见方案 5.6）。
      # 需仓库配置 GPG_PRIVATE_KEY / GPG_PASSPHRASE secret 才生效；
      # 未配置时跳过（不阻塞发布）。签名发布后，用户以公钥验证 SHA256SUMS。
      # 注意：secrets 上下文不可用于 if: 条件（工作流解析报错），改在步骤内判断。
      - name: 生成 GPG 签名（可选，需配置 secret）
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "未配置 GPG_PRIVATE_KEY secret，跳过 GPG 签名"
            exit 0
          fi
          # 多行 secret 经环境变量传递，用 printf 落文件避免 heredoc 展开问题
          printf '%s' "$GPG_PRIVATE_KEY" > gpg-import.key
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --import gpg-import.key 2>/dev/null
          else
            gpg --batch --yes --import gpg-import.key 2>/dev/null
          fi
          for checksum in "$RUNNER_TEMP"/artifacts/SHA256SUMS-*.txt; do
            [ -e "$checksum" ] || continue
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --detach-sign --armor -o "$checksum.sig" "$checksum" 2>/dev/null
            else
              gpg --batch --yes --detach-sign --armor -o "$checksum.sig" "$checksum" 2>/dev/null
            fi
            echo "GPG 签名: $(basename "$checksum").sig"
          done
          rm -f gpg-import.key

      # ── 上传到 GitHub Release ──────────────────────────────────────
      # FINAL L2：先组装说明（含 L1 缺席声明），创建 Release 元数据，
      # 再按文件循环挂载——任何"非预判"上传错误立即硬失败（fail-fast）。
      - name: 组装发布说明（含缺席声明）
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/artifacts"
          TAG="${GITHUB_REF_NAME}"
          BODY="$DIR/RELEASE_BODY.md"
          {
            echo "## OmniCrawler ${TAG}"
            echo
            echo "> 由 CI 自动构建（GitHub Actions 三平台 runner）。"
            echo
            echo "### 便携包"
            echo "- **Windows**（Standard/Full）：GUI + Chromium +（Full 含）ChromeDriver/Tesseract/PaddleOCR"
            echo "  - 安装：解压 ZIP → 双击 OmniCrawler-Launcher.bat"
            echo "- **Linux**（Standard/Full）：GUI + Chromium +（Full 含）Tesseract/ChromeDriver/PaddleOCR（构建期打包，解压即用）"
            echo "  - 安装：tar -xJf 包名 && ./OmniCrawler/omnicrawler --help"
            echo "- **macOS**（Standard/Full）：.app（ad-hoc 签名）+（Full 含）Tesseract/ChromeDriver（Paddle OCR 以 Transformers 后端替代）；首次打开请右键 → 打开"
            echo "  - 安装：挂载 dmg → 进入 OmniCrawler 文件夹 → 将 OmniCrawler.app 拖入 Applications"
            echo
            echo "### 安全"
            echo "- 各平台产物附带 SHA256SUMS-platform.txt 校验和（与 omnicrawler-provenance.json 对应）"
            echo "- omnicrawler-sbom-platform.cdx.json：各平台依赖物料清单（CycloneDX）"
            echo "- 可用 gh attestation verify 包名 --owner Starlife-creator 验证构建来源（keyless 签名，无需导入任何密钥）"
            echo "- 本版本未做代码签名（Windows Authenticode / macOS Developer ID）；校验完整性请以 SHA-256 为准"
            shopt -s nullglob
            manifests=("$DIR"/SKIPPED-*.txt)
            if [ ${#manifests[@]} -gt 0 ]; then
              echo
              echo "### ⚠️ 本次未随发布的包（超过 GitHub 单文件上限 2 GiB）"
              echo
              cat "${manifests[@]}"
              echo
              echo "替代路径：下载对应平台 Standard 包，使用 omnicrawler components import 加装 OCR 组件；或源码安装 full 依赖集获得完整能力。"
            fi
          } > "$BODY"
          echo "── RELEASE_BODY.md ──"
          cat "$BODY"

      - name: 发布到 GitHub Release（元数据）
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OmniCrawler ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/artifacts/RELEASE_BODY.md
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v') && contains(github.ref_name, '-') }}

      - name: 逐文件挂载资产（意外错误硬失败；超限项已在源头剔除）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          # FINAL 修复：循环会 cd 进 artifacts 目录（无 .git），gh 解析仓库
          # 依赖 GH_REPO 显式指定，否则报 "not a git repository"（v0.11.1 实测）
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd "$RUNNER_TEMP/artifacts"
          shopt -s nullglob
          mounted=0
          for f in *; do
            case "$f" in
              SKIPPED-*.txt|RELEASE_BODY.md) continue ;;
            esac
            gh release upload "$TAG" "$f" --clobber
            echo "已挂载: $f"
            mounted=$((mounted + 1))
          done
          echo "共挂载 $mounted 个资产"

      - name: 缺席汇总告警（黄灯语义：成功但需知悉）
        if: github.event_name == 'push'
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for m in "$RUNNER_TEMP/artifacts"/SKIPPED-*.txt; do
            found=1
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning::发布缺席（超限降级）: $line"
            done < "$m"
          done
          if [ "$found" -eq 0 ]; then
            echo "无缺席产物，全部资产已挂载"
          fi

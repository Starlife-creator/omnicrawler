name: secret scan

# C-#2：提交历史与工作树中的密钥/凭据泄露扫描（gitleaks）。
# 此前 .github/ 下无任何 secret 扫描工作流，历史提交中的 token/私钥无自动化防线。

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, master, "fix/**", "work/**"]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 扫描完整提交历史需要全量克隆；浅克隆会漏掉历史泄露。
          fetch-depth: 0
      - name: Scan git history and working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

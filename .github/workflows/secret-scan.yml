name: secret scan

# C-#2：提交历史与工作树中的密钥/凭据泄露扫描（gitleaks）。
# 此前 .github/ 下无任何 secret 扫描工作流，历史提交中的 token/私钥无自动化防线。

concurrency:
  # 并发组是全仓共享、跨工作流的：用裸 github.ref 会与 quality.yml 的同名组撞车，
  # 谁后起谁就把对方整条取消（实测 quality 的 7 个必需检查全变 cancelled）。
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, master, "fix/**", "work/**"]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 扫描完整提交历史需要全量克隆；浅克隆会漏掉历史泄露。
          fetch-depth: 0
      - name: Scan git history and working tree for secrets
        # v2→v3（dependabot #159 的内容），并按本仓统一写法钉到 commit：
        # 浮动 major 引用会随上游漂移，而这条是**阻断**步骤，引用必须可复现。
        # 已实测该账号无需 license（作业日志："[Starlife-creator] is an individual user.
        # No license key is required."），所以不需要新增 GITLEAKS_LICENSE secret。
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

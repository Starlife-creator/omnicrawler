name: probe-bisect

# 临时二分（第 3 轮）：只调 reusable，不传表达式（全用字面量）。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      build_python_version: "3.13"
      asset_max_bytes: "2039693706"
      delta_baselines: ""

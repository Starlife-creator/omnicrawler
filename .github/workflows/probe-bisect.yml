name: probe-bisect

# 临时二分诊断用：只保留最小结构，确认哪种写法会让 GitHub 解析阶段失败。
# 定位完即删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-22.04
    outputs:
      decision: ${{ steps.classify.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: emit
        id: classify
        run: |
          echo "decision=reuse" >> "$GITHUB_OUTPUT"

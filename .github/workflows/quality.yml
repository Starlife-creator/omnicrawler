name: quality

concurrency:
  # 组名带前缀：并发组是全仓共享的，裸 `github.ref` 会与任何同样裸写的工作流互撞并
  # 互相 cancel-in-progress（实测把 7 个必需检查整条取消成 cancelled）。
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/quality.txt
  # ★ `fonts-noto-cjk`（见各 job 的 Qt 依赖安装步骤）：Linux 上 Qt 走 **fontconfig** 取系统字体，
  # 裸 runner 一个字体都没有（实测 `QFontDatabase.families()` 为空、连 `inFont("A")` 都是 False）
  # ⇒ 等宽字体的 CJK 覆盖检查（`tests/unit/gui/test_mono_font_cjk.py`）只能**可见地跳过**。
  # 装上 CJK 字体后该检查在 CI 真正跑起来（缺字形即红），也让 GUI 测试不再运行在"零字体"的
  # 失真环境里。
  # ★ **Windows 上必须**（2026-09-15 实测）：runner 的 stdout 默认是 **cp1252**，而 `tools/` 下的
  # 脚本会打印中文（门禁结论、错误提示）⇒ 一旦有非 ASCII 就 `UnicodeEncodeError: 'charmap'`
  # 直接崩（`check_coverage_gates.py`、`check_gui_conventions.py` 都踩过），而 ubuntu/macOS 是
  # UTF-8 毫无症状。这里只在 **job 级**改 **stdio** 编码（`PYTHONIOENCODING`），
  # **不动 `open()` 的默认编码**（那要用 `PYTHONUTF8=1`，会影响读文件的测试，风险更大）。
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  minimal-install:
    name: minimal install / import boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Deliberately install no feature extra: this catches optional dependency
      # leaks that the broad test environment would otherwise conceal.
      - run: python -m pip install -e .
      - run: python tools/check_minimal_install.py
      - run: python tools/check_architecture.py
      - run: python tools/check_sdk_api.py

  feature-install:
    name: feature install / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [html, pdf, async-http, tls, streams, storage, security, ai, document]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[${{ matrix.profile }}]"
      - run: python tools/check_extra_install.py "${{ matrix.profile }}"

  lockfile:
    name: dependency lock / reproducible install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # 无需 uv 即可跑的一致性门禁（与其他静态门禁共用清单 tools/gate_registry.py）
      - run: python tools/check_lockfile_consistency.py
      - run: python -m pip install --upgrade pip
      - name: Install uv
        # 约束文件不为 uv 自身设计；install uv 时显式绕过，避免约束与解析器依赖打架
        env:
          PIP_CONSTRAINT: ""
        run: python -m pip install "uv>=0.5,<1"
      # 权威判定：锁文件与 pyproject 同步（改了 pyproject 却没重新 lock 会在此失败）
      - run: uv lock --check
      # 验收「干净机器按锁文件复现环境」：只按锁文件安装，不允许解析出新版本
      - run: uv sync --locked
      - name: Verify the reproduced environment works
        run: uv run python -c "import omnicrawler; print('omnicrawler', omnicrawler.__version__)"

  test:
    # ★ 按各平台**实测分布**定上限（2026-09-21 实测 main 近 4 次成功运行的 `test` 作业耗时）：
    #   ubuntu-latest 15–16 分 / macos-latest 13–17 分 / **windows-latest 27–29 分**。
    # 原值 30 对 Windows 只剩 1–3 分钟余量 ⇒ 任何新增测试都可能被**超时取消**
    # （结论是 `cancelled`：前 16 步全绿、卡在 `coverage run -m pytest`；PR #81 即因此卡住）。
    # ★ 超时是**资源上限**，不是正确性门禁：测试内容与各门禁一字未改，此处只消除假阴性。
    # 45（≈ Windows 实测 1.5×）给最慢平台留出余量；其余平台更宽裕，且作业成功即结束、不占额外时间。
    timeout-minutes: 45
    strategy:
      # Keep every platform running so one assertion cannot hide another failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 固定市场 SHA；保留同级目录和 LF 字节，不改用户的本地市场 checkout。
      - name: Checkout pinned OmniCrawler-market (sibling)
        env:
          MARKET_REPO_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
        run: python tools/checkout_market.py
      - run: python -m pip install --upgrade pip
      # storage extra 同时提供 duckdb 与 pyarrow：此前只在命令里临时加 duckdb，
      # pyarrow 缺失让 3 条 convertx 用例在 ubuntu/macOS 上失败（2026-09-15 实测）。
      # 依赖范围以 pyproject 为唯一真源，CI 不再手抄版本号。
      - run: python -m pip install -e ".[html,pdf,dev,async-http,gui,tls,storage,ai,document]" cryptography
      - name: Exercise optional Zstandard decoding on every supported platform
        run: python -m pip install zstandard==0.25.0
      - if: runner.os == 'Linux'
        name: Install Qt runtime dependencies
        # gettext：msgfmt --check-format 需要（ubuntu-latest 实测不预装）
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 fonts-noto-cjk gettext
      - run: python -m compileall -q src tests examples
      - run: python tools/check_release_integrity.py
      - run: python tools/check_architecture.py
      - run: python tools/check_sdk_api.py
      - run: python tools/check_cli_docs.py
      - run: python tools/check_docs_consistency.py
      # C-#23：换行规则与 .gitattributes 现行规则一致性门禁
      - run: python tools/check_line_endings_policy.py
      # C-#17 / C-#18 / C-#11：根目录 shell/command 脚本语法、失败保护、venv 守卫、
      # Python ≥3.12 断言与构建 venv extras 语义静态检查
      - run: python tools/check_shell_scripts.py
      # C-#14 / C-#20：OpenCV 单变体、死依赖退役、版本上下界一致性
      - run: python tools/check_dependency_consistency.py
      # C-#30：tests/unit/gui 与 tests/gui 归属规则（双名文件 / 反向跨目录依赖）
      - run: python tools/check_gui_test_layout.py
      # C-#13：UI 层直连 StateStore 点位白名单（禁止新增、存量只降不升）
      - run: python tools/check_gui_state_threading.py
      # C-#19：MainWindow 组合根规模 ratchet（行数 / 方法数 / 最长方法只降不升）
      - run: python tools/check_main_window_size.py
      # C-#4 / C-#27：英文翻译覆盖率下限门禁（实测 20.5%；阈值 20.0% 只防下滑，补译完成后上调）
      - run: python tools/i18n_stats.py --check --min-coverage 0.20
      # C-#4 / C-#27：.po/.pot 格式与占位符校验（msgfmt --check-format）。
      # ★ ubuntu-latest **不预装** gettext（实测 `msgfmt: command not found`，exit 127），
      #   所以上面的 apt 步骤显式装了 gettext；Windows/macOS 平台同类校验待补装后纳入矩阵。
      - name: Validate translation catalog format with msgfmt
        if: runner.os == 'Linux'
        run: |
          msgfmt --check-format -o /tmp/omnicrawler-gui.po.mo locale/en_US/LC_MESSAGES/omnicrawler-gui.po
          msgfmt --check-format -o /tmp/omnicrawler-gui.pot.mo locale/omnicrawler-gui.pot
      - run: python tools/check_network_boundaries.py
      - name: egress policy runtime check (B13-001)
        # Windows runner 默认 pwsh 不支持 bash heredoc → 显式用 bash
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from omnicrawler.core.config import DEFAULTS, AppConfig
          from omnicrawler.security.egress import EgressBroker
          from omnicrawler.security.policy import PolicyBlockedError

          with tempfile.TemporaryDirectory() as td:
              cfg = AppConfig(Path('<ci>'), Path(td), DEFAULTS, Path(td))
              broker = EgressBroker(cfg)
              try:
                  with broker.request('http://169.254.169.254/latest/meta-data', purpose='ci-test'):
                      pass
              except PolicyBlockedError:
                  pass
              else:
                  raise SystemExit('BUG: private metadata target not blocked by egress')
          print('egress runtime verification OK (private target blocked)')
          PY


      - run: python tools/check_coding_standards.py src
      # `--durations` 只追加报告、不改判定：把「哪条腿 / 哪个用例慢」变成可观测数据。
      # 热点必须在 CI 上量：本地开发机与 runner 的倍率可达 6~10×，用本地耗时推断 CI
      # 会得出错误结论（2026-09-21 实测：本地 0.5s 收尾的整段在 CI 上占 267s）。
      - id: core_tests
        run: python -m coverage run -m pytest -q --durations=25 --durations-min=0.5 --junitxml=artifacts/ci/pytest-core.xml
      # `--fail-under=0`：本步骤只**取数据**，判定统一交给 `tools/check_coverage_gates.py`
      # （单一判据）。否则 pyproject.toml 的 `fail_under = 66` 会在这里先以 exit 2 抢跑——
      # 全量跑时它恰好也过，但在**子集**（如浏览器 job，实测总覆盖率 23%）会直接把门禁
      # 挡在"数据生成"阶段，连门禁自己的输出都看不到。
      - id: core_coverage
        if: ${{ !cancelled() && (steps.core_tests.outcome == 'success' || steps.core_tests.outcome == 'failure') }}
        run: python -m coverage json -o coverage.json --fail-under=0
      # 显式 core 档：本 job 不装 browser extras ⇒「需浏览器运行时的单文件下限」在这里
      # 永远不可能达标（browser_engines.py 实测 73.47% < 86%）。那些下限**不删除**，
      # 挪到装了 chromium 的 gui-and-browser job 用 --profile browser 检查。
      - if: ${{ !cancelled() && steps.core_coverage.outcome == 'success' }}
        run: python tools/check_coverage_gates.py --profile core coverage.json
      - if: ${{ !cancelled() && steps.core_coverage.outcome == 'success' }}
        run: python -m coverage report
      - run: python -m omnicrawler.cli templates validate
      # 范围与 tools/gate_registry.py 的 ruff 门禁保持一致（含 tools）；
      # 本地 `python tools/self_verify.py` 跑的就是同一集合。
      - run: python -m ruff check src tests tools
      # P2-2：被豁免规则的存量违规预算（存量违规只降不升，新代码不许搭便车）
      - run: python tools/check_lint_budget.py
      # 设计体系继承约定（a11y / 内联样式 / 裸色值）：新文件零容忍，存量只降不升
      - run: python tools/check_gui_conventions.py
      # 市场内容质量：审查清单里可机器判定的部分（需要 checkout_market.py 拉来的同级市场）
      - run: python tools/check_market_content.py
      # agent 面契约：命令/参数/退出码/stdout 形态必须完整且「解析器 ⇄ 注册表」双向自洽（P2-4）
      - run: python tools/check_agent_surface.py --check
      - run: python -m mypy src/omnicrawler
      # 走 tools/build_wheel.py：它先清 build/ 再构建（裸 pip wheel 在同一工作树里
      # 第二次会因 setuptools 复用 build/ 而失败，见 §5.7 / W6.7-⑥）
      - run: python tools/build_wheel.py -w dist
      - run: python tools/check_release_integrity.py --wheel-dir dist
      - run: python tools/build_source_archive.py --output-dir dist
      - run: python tools/check_release_integrity.py --source-zip-dir dist
      - run: python tools/generate_sbom.py --output dist/omnicrawler-sbom.cdx.json
      - run: python tools/check_guardrails.py --sbom dist/omnicrawler-sbom.cdx.json
      - run: python tools/generate_checksums.py dist --output SHA256SUMS-ci.txt
      - run: python tools/generate_checksums.py dist --output SHA256SUMS-ci.txt --check
      - run: python tools/generate_provenance.py --artifact-dir dist --output dist/omnicrawler-provenance.json

      - name: Preserve core test and coverage diagnostics
        if: ${{ !cancelled() && (steps.core_tests.outcome == 'success' || steps.core_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-diagnostics-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            artifacts/ci/pytest-core.xml
            coverage.json
            .coverage
          include-hidden-files: true
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ★ W3.4：市场仓在**宿主机**检出（此时还有网）；容器内一律断网。
      - name: 检出市场仓（宿主机、联网；容器内不使用网络）
        run: python tools/checkout_market.py --latest --destination "$RUNNER_TEMP/OmniCrawler-market"
      # ★ W3.4：**测试镜像要多装 `security` extra**（`cryptography`）。
      #   市场包安装要做 ed25519 验签，而 `signing.py` 是惰性导入 `cryptography`
      #   （属可选 `[security]`）⇒ 只装 `[html,async-http,streams]` 的镜像里**验签必失败**。
      #   ★ 刻意用 build-arg 而不是改 Dockerfile 默认值：**不改动交付镜像的依赖集**。
      - run: docker build --build-arg EXTRAS=html,async-http,streams,security -t omnicrawler:ci .
      # C-#2：镜像漏洞扫描占位（trivy）。⬜ 待 CI 环境确认 trivy runner 可用、并完成
      # 现有镜像 HIGH/CRITICAL 基线三审后改为阻断；当前 continue-on-error 仅归档报告，
      # 不阻塞合并。扫描范围 omnicrawler:ci 测试镜像，severity 仅 HIGH/CRITICAL。
      - name: Image vulnerability scan（trivy 占位，待基线三审）
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omnicrawler:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ matrix.os || 'ubuntu' }}
          path: trivy-report.json
          if-no-files-found: warn
      # ★ W3.4（§5.4 #14）：把「离线可用」从**静态预检**（模块级是否导入网络库）升级为**运行级**验证。
      #   判据（照方案原文）：断网容器内全流程成功；**任一网络调用即失败**。
      #   工具自己会先证明「确实断网」（外连必须失败），否则整轮检查在空转 ⇒ 直接判红。
      #   `tools/` 与市场仓只读挂载 ⇒ 镜像不变，容器本身不产生任何网络访问。
      - name: 断网容器内离线验收（装市场包 → 导入 → 跑本地样例）
        run: |
          docker run --rm --network none \
            --entrypoint python \
            -v "$PWD/tools:/tools:ro" \
            -v "$RUNNER_TEMP/OmniCrawler-market:/market:ro" \
            omnicrawler:ci /tools/offline_acceptance.py --market-dir /market --require-offline

  gui-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OMNICRAWL_BROWSER_TESTS: "1"
      # GUI 用例崩溃时自动落 faulthandler 段回（定位段错误用；对正常通过无影响）
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[html,browser,gui,dev]"
      - name: Install image comparison dependency
        run: python -m pip install Pillow==12.3.0
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 fonts-noto-cjk
      - name: Compare GUI with reviewed source reference in the same environment
        run: python tools/check_visual_regression.py --output artifacts/visual-regression
      - name: Preserve visual regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: artifacts/visual-regression
          if-no-files-found: error
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --collect-only -q tests/gui/test_gui_smoke.py tests/integration/browser/test_browser_integration.py
      # 装了 chromium 的环境 ⇒ 在这里执行「需浏览器运行时的单文件下限」（--profile browser）。
      # 这样 browser_engines / browser_pool 的严格下限**仍然有人查**，只是移到能达成的环境。
      - run: python -m coverage run -m pytest -q tests/gui/test_gui_smoke.py tests/integration/browser/test_browser_integration.py
      # `--fail-under=0`：本步骤只**取数据**，判定统一交给 `tools/check_coverage_gates.py`
      # （单一判据）。否则 pyproject.toml 的 `fail_under = 66` 会在这里先以 exit 2 抢跑——
      # 全量跑时它恰好也过，但在**子集**（如浏览器 job，实测总覆盖率 23%）会直接把门禁
      # 挡在"数据生成"阶段，连门禁自己的输出都看不到。
      - run: python -m coverage json -o coverage.json --fail-under=0
      - run: python tools/check_coverage_gates.py --profile browser coverage.json

  windows-full-dependency-matrix:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Checkout pinned OmniCrawler-market (sibling)
        env:
          MARKET_REPO_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
        run: python tools/checkout_market.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full]"
      - run: python -m pip check
      # P6-1：依赖完整性门禁——full extra 每个包都必须已安装（防止漏声明/漂移回归），
      # 并显式探测 change_detector 走的 selectolax 路径可导入。
      - name: 依赖完整性门禁（P6-1）
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import importlib.metadata
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          full = pyproject["project"]["optional-dependencies"]["full"]
          missing = []
          for req in full:
              name = re.match(r"[A-Za-z0-9_.-]+", req)
              if not name:
                  continue
              norm = re.sub(r"[-_.]+", "-", name.group(0)).lower()
              try:
                  importlib.metadata.distribution(norm)
              except importlib.metadata.PackageNotFoundError:
                  missing.append(name.group(0))
          if missing:
              raise SystemExit(f"P6-1 FAIL: full extra has uninstalled packages: {missing}")
          import selectolax  # change_detector 的 HTML 抽取路径
          print(f"P6-1 OK: full extra {len(full)} packages installed; selectolax importable")
          PY
      # C-#2：依赖漏洞扫描由 continue-on-error 改为阻断——此前已知漏洞依赖可静默合入主干。
      # 已确认误报 / 官方延迟修复项经仓库变量 PIP_AUDIT_IGNORE（空格分隔 CVE 编号）显式放行，
      # 不再整体跳过扫描。
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit resolved full dependency environment（阻断）
        shell: bash
        env:
          PIP_AUDIT_IGNORE: ${{ vars.PIP_AUDIT_IGNORE }}
        run: |
          ignore_args=()
          n_baseline=0
          # 已审基线：无可用修复版本的告警随仓库走（可评审），vars.PIP_AUDIT_IGNORE 作临时补充
          # 本作业跑在 windows runner 上 ⇒ 必须剥掉 \r：带着 \r 的 id 不会与任何告警匹配，
          # 基线会**静默失效**（放行不了，也报不出为什么）。
          for vuln in $(grep -E '^(CVE|PYSEC|GHSA)-' tools/pip-audit-ignore.txt 2>/dev/null | tr -d '\r'); do
            ignore_args+=(--ignore-vuln "$vuln")
            n_baseline=$((n_baseline + 1))
          done
          for vuln in $PIP_AUDIT_IGNORE; do ignore_args+=(--ignore-vuln "$vuln"); done
          # 报**条数**而不是数组长度：每个 id 展开成 2 个参数，用 ${#ignore_args[@]} 会翻倍。
          echo "pip-audit 已审基线：放行 ${n_baseline} 条 id（仓库内可评审），新增漏洞仍阻断"
          pip-audit --local "${ignore_args[@]}" --format json --output dependency-audit.json
      - run: python -m omnicrawler.cli capabilities --verify-imports
        env:
          PYTHONIOENCODING: utf-8
      - run: python -m compileall -q src tools tests
      - run: python tools/check_release_integrity.py
      - run: python tools/check_architecture.py
      - run: python tools/check_docs_consistency.py
      - run: python tools/check_network_boundaries.py
      - run: python tools/check_coding_standards.py src
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-windows-full
          path: dependency-audit.json
          if-no-files-found: warn
      # 3.13 轻量依赖 smoke：仅验证 full 依赖能装能导入（交付物冻结 3.12，不全量 pytest）

  # C-#2：PR 依赖声明审查——新增/升级依赖的许可证与已知漏洞提示，仅在 PR 触发时运行。
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan PR dependency changes
        # 本仓 Dependency graph 未启用（`GET /dependency-graph/sbom` 实测 404），action 只会
        # 报 "Dependency review is not supported on this repository" ⇒ 每条 PR 恒定红。
        # 在 Settings → Code security 打开 Dependency graph 后去掉本行恢复阻断。
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  # C-#2：SAST 静态安全扫描占位（bandit，覆盖安全与配置敏感模块）。
  # ⬜ 待 CI 环境完成存量告警基线三审、建立 .bandit 配置与白名单后改为阻断；
  # 当前 continue-on-error 仅收集告警并归档报告，不阻塞合并。
  sast-bandit:
    name: SAST bandit（占位，待基线三审）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install bandit
      - name: Bandit SAST（security/ 与 core/；结果待基线三审，暂不阻断）
        continue-on-error: true
        run: bandit -r src/omnicrawler/security src/omnicrawler/core -f json -o bandit-report.json
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

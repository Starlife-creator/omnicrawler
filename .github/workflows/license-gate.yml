name: license-gate

# Phase 1（方案 A7）：依赖许可防线。pip-licenses 全量扫描（含传递依赖）。
#
# 两档模式（--strict 控制）：
# - 非严格档：只拒「任何阶段都不兼容」的清单（GPL-2.0 系 / CC-BY-NC-* /
#   LicenseRef-* / 未知许可）。
# - 严格档：在其之上**追加**「零 AGPL / GPL 残留」。
# ★ 现状（2026-09-22）：**宿主已完成 AGPL-3.0 → Apache-2.0 迁移**，故严格档**常开**
#   （`STRICT=true`）。既定的 LGPL 豁免项（PySide6 / psycopg，Phase 0 已定）不在拒绝范围。
#
# 注意：只扫依赖树（pip 元数据面）；打包产物面（Qt DLL/paddle .so/字体等
# 无 pip 元数据文件）由 release 门禁的 CycloneDX SBOM 扫描覆盖（A7 双面验证）。

concurrency:
  group: license-gate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "constraints/**"
      - ".github/workflows/license-gate.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "constraints/**"
      - ".github/workflows/license-gate.yml"
  workflow_dispatch:

jobs:
  license-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: 安装项目依赖（full extras 闭包）
        run: python -m pip install ".[html,pdf,browser,async-http,security]"
      - name: 安装 pip-licenses
        run: python -m pip install "pip-licenses>=5,<6"
      - name: 依赖树许可扫描
        run: |
          # 宿主已为 Apache-2.0（Phase 0 完成）⇒ 严格档常开。
          STRICT=true
          # 立即拒绝清单（任何阶段都不兼容）
          # ★ `\b` 锚定：`\bGPL` **不匹配** `LGPL`（G 前是词字符 ⇒ 无词边界），
          #   这正是 PySide6 / psycopg 这两个既定 LGPL 豁免项能通过的前提；
          #   此前写作 `GPL-2.0-only`（无锚定）会误伤 `LGPL-2.0-only`。
          # ★ `Unknown license` 是**死规则**：pip-licenses 判定不出时写的是 `UNKNOWN`，
          #   两者不匹配 ⇒ 未知许可依赖一直漏网。补 `UNKNOWN`（IGNORECASE 下大小写通吃）。
          DENY_ALWAYS="\\bGPL-2.0-only|\\bGPL-2.0-or-later|CC-BY-NC|LicenseRef|Unknown license|\\bUNKNOWN"
          # 严格档追加拒绝：零 AGPL / GPL 残留（LGPL 属既定豁免，不在其中）
          DENY_STRICT="\\bAGPL|\\bGPL"
          # ★ 严格档是**追加**而非**替换**：早期实现写 `DENY="$DENY_STRICT"`，
          #   会把 CC-BY-NC / LicenseRef / Unknown 一并放开 —— 开严格档反而更松。
          DENY="$DENY_ALWAYS"
          if [ "$STRICT" = "true" ]; then DENY="$DENY_ALWAYS|$DENY_STRICT"; fi
          # pip 子命令插件机制已废弃（"pip licenses" 报 unknown command），
          # 直接调用 pip-licenses 控制台命令（本地 pip-licenses 5.5.5 验证可用）。
          pip-licenses --format=json --with-urls > licenses.json
          python - <<EOF
          import json, re, sys
          deny = re.compile(r"$DENY", re.IGNORECASE)
          rows = json.load(open("licenses.json", encoding="utf-8"))
          bad = [(r["Name"], r["License"]) for r in rows
                 if deny.search(str(r.get("License", "")) or "Unknown license")]
          # 自包豁免：本项目自身条目不在扫描拒绝范围
          bad = [(n, l) for (n, l) in bad if n.lower() not in ("omnicrawler",)]
          for name, lic in bad:
              print(f"DENY {name}: {lic}")
          if bad:
              print(f"license-gate: {len(bad)} 个依赖命中拒绝清单")
              sys.exit(1)
          print(f"license-gate: OK（{len(rows)} 个依赖，无命中）")
          EOF
      - name: 上传许可清单
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report
          path: licenses.json

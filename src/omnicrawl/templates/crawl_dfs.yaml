template_version: 1

project: {name: 示例项目-DFS站内爬取, workspace: work/crawl_dfs}

source: {kind: crawl, seeds: [https://example.com/]}

crawl: {strategy: dfs, max_pages: 100, max_depth: 5, same_host: true, concurrency: 4}

http: {user_agent: "OmniCrawler/0.4.0 (+contact: crawler@example.org)", respect_robots: true, delay_seconds: 1.0}

extract: {mode: auto, fields: {title: {selector: title}}}

template_version: 1

template:
  id: protocols/rest-cursor
  name: "REST 下一页/链接"
  category: protocols/api
  description: "从 JSON 响应的 next 字段继续翻页，适合游标或 next URL 接口"
  version: 1.0.0
  tags: [REST, JSON, 游标分页]
  capabilities: [rest, json, next-url-pagination]

  placeholders:
    api_url: {label: API 地址, required: true}
    next_json_path: {label: 下一页 JSON 路径, default: next}

  header_contains: {content-type: application/json}
  json_keys: [next, results]

  verified_at: '2026-07-17'

project: {name: rest_cursor, workspace: work/rest_cursor}

source:
  kind: rest
  seeds: ['{{api_url}}']
  pagination: {next_path: '{{next_json_path}}'}

crawl: {max_pages: 1000, concurrency: 4}

http: {respect_robots: true, delay_seconds: 0.5, headers: {Accept: application/json}}

extract: {mode: json, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

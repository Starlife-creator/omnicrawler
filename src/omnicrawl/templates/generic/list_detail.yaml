template_version: 1

template:

  id: generic/list-detail

  name: 通用列表到详情

  category: generic

  description: 从栏目或搜索列表自动发现详情页并抽取正文

  version: 1.0.0

  tags: [通用, 列表页, 详情页]

  capabilities: [crawl, link-discovery, auto-extraction, deduplication]

  placeholders:

    seed_url: {label: 列表页网址, required: true}

  verified_at: '2026-07-17'

project: {name: list_detail, workspace: work/list_detail}

source: {kind: crawl, seeds: ['{{seed_url}}']}

crawl:

  strategy: bfs

  max_pages: 500

  max_depth: 3

  same_host: true

  concurrency: 4

  deny_patterns: ['*/login*', '*/logout*', '*/cart*']

http: {respect_robots: true, delay_seconds: 1.0, auto_browser_fallback: true}

extract: {mode: auto, fields: {}, quality_threshold: 0.78, review_low_confidence: true}

incremental: {skip_unchanged: true, archive_raw: true}

outputs: {jsonl: true, csv: true, xlsx: true}

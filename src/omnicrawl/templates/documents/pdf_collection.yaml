template_version: 1

template:
  id: documents/pdf-collection
  name: PDF文档集合
  category: documents/pdf
  description: "从指定栏目按条件发现PDF链接，对文件下载并分类入PDF解析、OCR和人工复核流程"
  tags: [PDF, OCR, table, attachment]
  capabilities: [crawl, attachment-download, pdf, ocr, review]
  intents: [documents]
  recommended_when: "已知目标栏目URL，希望批量采集其中主要典藏的PDF"
  limitations: "动态搜索或无后缀链接的PDF可能漏采集；动态渲染、非标准接口支持有限"

  placeholders:
    seed_url: {label: 文档栏目地址, required: true}

  verified_at: '2026-07-17'

project: {name: pdf_collection, workspace: work/pdf_collection}
source: {kind: focused, seeds: ['{{seed_url}}']}

crawl:
  strategy: priority
  focus_keywords: [pdf, document, attachment, file]
  max_pages: "2000"
  max_depth: 4
  same_host: true
  concurrency: 4

selection:
  topic:
    enabled: false
    include_any: []
    include_all: []
    exclude: []
    match_on: [url, anchor, title, heading, text]
    keep_uncertain: true
    filter_records: true

http: {respect_robots: true, delay_seconds: "1.0", auto_browser_fallback: true}
extract: {mode: auto, fields: {}, review_low_confidence: true}
download: {enabled: true, extensions: [.pdf], media: false}

processors:
  pdf: {enabled: true, config: builtin:pdf/generic_template.yaml, project_config: '', skip_ocr: false}

incremental: {skip_unchanged: true, archive_raw: true}
updates: {enabled: true, revisit_completed: true, detect_same_url_changes: true, keep_versions: true}
outputs: {jsonl: true, csv: true, xlsx: true}

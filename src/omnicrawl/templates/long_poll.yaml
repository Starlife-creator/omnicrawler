template_version: 1
project: {name: "示例项目-长轮询", workspace: work/long_poll}
source:
  kind: long_poll
  seeds: [https://stream.example.invalid/poll]
  method: GET
  max_messages: 100
  duration_seconds: 60
crawl: {max_pages: 100, same_host: true}
http: {user_agent: "OmniCrawler/0.4.0 (+contact: crawler@example.org)", respect_robots: true, delay_seconds: 1.0}
extract: {mode: json, item_path: "$"}

template_version: 1

# 模板: 静态网页采集 (Static HTML)

# 适用: 纯HTML页面，无需JavaScript渲染

# 特点: 直接解析HTML，速度快，资源消耗低

project: {name: 示例项目-静态网页, workspace: work/static_html}

source: {kind: static_html, seeds: [https://example.com/]}

# ── HTTP 请求设置 ──

http: {user_agent: "OmniCrawler/0.3.0 (+contact: crawler@example.org)", respect_robots: true, delay_seconds: 1.0}

# ── 提取规则 ──

extract: {mode: html, fields: {title: {selector: title}, heading: {selector: h1}, links: {selector: "a[href]", attr: href, all: true, join: " | "}}}

template_version: 1

template:

  id: cms/shopify-public

  name: Shopify 公开商品与集合

  category: cms/shopify

  description: 采集仅公开的商品与集合页面；不使用或绕过商店后台接口

  version: 1.0.0

  tags: [Shopify, 电商, 商品]

  capabilities: [crawl, product-schema, json-ld, evidence]

  placeholders:

    collection_url: {label: 公开集合地址, required: true}

  url_patterns: ['*/collections/*', '*/products/*']

  html_contains: [Shopify.theme, shopify-section, /cdn/shop/]

  verified_at: '2026-07-17'

project: {name: shopify_public, workspace: work/shopify_public}

source: {kind: crawl, seeds: ['{{collection_url}}']}

crawl: {strategy: priority, focus_keywords: [collections, products], max_pages: 5000, max_depth: 4, same_host: true, concurrency: 3}

http: {respect_robots: true, delay_seconds: 1.5, auto_browser_fallback: true}

extract: {mode: auto, fields: {}, quality_threshold: 0.85, review_low_confidence: true}

incremental: {skip_unchanged: true, archive_raw: true}

outputs: {jsonl: true, csv: true, xlsx: true}

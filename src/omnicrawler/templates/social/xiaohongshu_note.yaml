template_version: 1

template:
  id: social/xiaohongshu-note
  name: "小红书笔记采集"
  category: social/xiaohongshu
  description: "采集小红书搜索页、话题标签页或用户主页的笔记列表，自动提取标题、作者、点赞/收藏等互动数据"
  version: 1.0.0
  tags: [xiaohongshu, social, notes, redbook, 社交媒体, 小红书, 种草]
  capabilities: [browser, auto-extraction, pagination]
  intents: [collect_section]
  recommended_when: "需要采集小红书上特定关键词、话题或用户的笔记内容"
  limitations: "小红书反爬严格，需要已登录的浏览器会话；建议使用高隐身等级 + 较长延迟"
  domains: [xiaohongshu.com, www.xiaohongshu.com]
  url_patterns: ["*/search_result/*", "*/user/profile/*", "*/explore/*"]
  html_contains: [note-item, noteId, xhs, red]
  placeholders:
    search_url: {label: "小红书搜索/话题/用户页地址", required: true}
  verified_at: '2026-08-04'

project: {name: xiaohongshu_notes, workspace: work/xiaohongshu_notes}
source: {kind: browser, seeds: ['{{search_url}}']}
crawl:
  strategy: priority
  focus_keywords: [note, item, card]
  max_pages: 200
  max_depth: 2
  same_host: true
  concurrency: 1
http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
  respect_robots: true
  delay_seconds: 4.0
  auto_browser_fallback: true
extract:
  mode: auto
  fields:
    title: {selector: '.title, .note-title, [data-v] .title', selector_type: css}
    author: {selector: '.author .name, .username', selector_type: css}
    likes: {selector: '.like-wrapper .count, .like-count', selector_type: css}
    description: {selector: '.desc, .note-desc', selector_type: css}
    note_url: {selector: 'a[href*="/explore/"]', selector_type: css, attribute: href}

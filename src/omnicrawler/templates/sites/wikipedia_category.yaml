template_version: 1
template:
  id: sites/wikipedia-category
  name: Wikipedia 分类成员
  category: sites/wikipedia
  description: 使用 MediaWiki 官方 Action API 采集 Wikipedia 分类成员
  version: 1.0.0
  tags:
  - Wikipedia
  - MediaWiki
  - 分类
  - API
  capabilities:
  - rest
  - continuation-token
  - site-adapter
  domains:
  - wikipedia.org
  placeholders:
    language:
      label: 语言子域
      default: zh
    category_name:
      label: 分类名称
      required: true
  source_urls:
  - https://www.mediawiki.org/wiki/API:Continue
  - https://www.mediawiki.org/wiki/API:Categorymembers
  verified_at: '2026-07-17'
  publisher: starlife
  author_fingerprint: 4c3014804d85de2568f85e62a3048429
  license: OmniCrawler-MIT; API 行为依据 MediaWiki 官方文档; 内容遵循各站点许可（如 CC BY-SA）
project:
  name: wikipedia_category
  workspace: work/wikipedia_category
source:
  kind: site_mediawiki
  seeds:
  - https://{{language}}.wikipedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Category:{{category_name}}&cmlimit=max&format=json
crawl:
  max_pages: 1000
  concurrency: 2
http:
  respect_robots: true
  delay_seconds: 1.0
  headers:
    Accept: application/json
extract:
  mode: json
  item_path: query.categorymembers[*]
  fields:
    page_id:
      path: pageid
      type: jsonpath
      required: true
    namespace:
      path: ns
      type: jsonpath
    title:
      path: title
      type: jsonpath
      required: true
outputs:
  jsonl: true
  csv: true
  xlsx: true

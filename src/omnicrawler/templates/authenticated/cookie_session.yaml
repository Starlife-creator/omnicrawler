template_version: 1

template:

  id: authenticated/cookie-session

  name: 合法登录会话

  category: authenticated/browser

  description: "使用高隐匿浏览器 Context，可选会话持久化，复用登录用户身份与授权状态"

  version: 1.0.0

  tags: [登录, Cookie, 会话, 浏览器]

  capabilities: [browser, authentication, isolated-context, session]

  placeholders:

    seed_url: {label: 已授权页面地址, required: true}

  source_urls: [https://playwright.dev/docs/auth]

  verified_at: '2026-07-17'

project: {name: cookie_session, workspace: work/cookie_session}

source: {kind: browser, seeds: ['{{seed_url}}']}

crawl: {max_pages: 500, max_depth: 3, same_host: true, concurrency: 1}

http: {respect_robots: true, delay_seconds: 1.0}

browser: {engine: playwright, headless: true, actions: []}

session: {persist_cookies: true, name: authorized_session}

extract: {mode: auto, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

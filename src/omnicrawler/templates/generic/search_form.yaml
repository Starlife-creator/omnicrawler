template_version: 1

template:

  id: generic/search-form

  name: 搜索与筛选表单

  category: generic/search

  description: 向公开搜索表单提交关键词和筛选条件，适用于无需授权的检索页

  version: 1.0.0

  tags: [搜索, 表单, 筛选]

  capabilities: [form, post, search]

  placeholders:

    search_url: {label: 搜索接口或表单地址, required: true}

    keyword: "{label: 查询关键词, required: true}"

    keyword_field: {label: 关键词字段名, default: q}

  verified_at: '2026-07-17'

project: {name: search_form, workspace: work/search_form}

source:

  kind: form

  seeds: ['{{search_url}}']

  method: POST

  fields: {'{{keyword_field}}': '{{keyword}}'}

crawl: {max_pages: 500, max_depth: 2, same_host: true, concurrency: 2}

http: {respect_robots: true, delay_seconds: 1.0}

extract: {mode: auto, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

template_version: 1

template:

  id: generic/numbered-pagination

  name: 页码翻页列表

  category: generic/pagination

  description: 通过查询参数预生成页码列表，适合结构稳定的公开栏目

  version: 1.0.0

  tags: [翻页, 页码, 列表页]

  capabilities: [http, numbered-pagination]

  placeholders:

    seed_url: {label: 第一页地址, required: true}

    page_parameter: {label: 页码参数名, default: page}

    end_page: {label: 终止页码, default: 20}

  verified_at: '2026-07-17'

project: {name: numbered_pagination, workspace: work/numbered_pagination}

source:

  kind: static_html

  seeds: ['{{seed_url}}']

  pagination: {type: page, parameter: '{{page_parameter}}', start: 1, end: '{{end_page}}'}

crawl: {max_pages: 1000, max_depth: 1, same_host: true, concurrency: 4}

http: {respect_robots: true, delay_seconds: 1.0}

extract: {mode: auto, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

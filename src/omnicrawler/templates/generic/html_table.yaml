template_version: 1

template:

  id: generic/html-table

  name: HTML表格

  category: generic/structured

  description: 自动识别页面表格并保留表头、单元格和来源证据

  version: 1.0.0

  tags: [表格, HTML, 结构化]

  capabilities: [http, table-extraction, evidence]

  placeholders:

    seed_url: {label: 表格页面地址, required: true}

  html_contains: ['<table', '<thead', '<tbody']

  verified_at: '2026-07-17'

project: {name: html_table, workspace: work/html_table}

source: {kind: static_html, seeds: ['{{seed_url}}']}

crawl: {max_pages: 10, max_depth: 1, same_host: true, concurrency: 2}

http: {respect_robots: true, delay_seconds: 1.0, auto_browser_fallback: true}

extract: {mode: html, item_selector: table, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

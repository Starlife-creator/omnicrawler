template_version: 1

template:

  id: generic/infinite-scroll

  name: 无限滚动页面

  category: generic/dynamic

  description: 使用浏览器滚动与等待动作触发并采集无限滚动页面

  version: 1.0.0

  tags: [动态加载, 无限滚动, 浏览器]

  capabilities: [browser, javascript, infinite-scroll]

  recommended_when: 地址栏网址不变，向下滚动后内容持续追加

  placeholders:

    seed_url: {label: 页面地址, required: true}

  html_contains: [IntersectionObserver, infinite-scroll, load-more]

  verified_at: '2026-07-17'

project: {name: infinite_scroll, workspace: work/infinite_scroll}

source: {kind: browser, seeds: ['{{seed_url}}']}

crawl: {max_pages: "50", max_depth: 1, same_host: true, concurrency: 1}

browser:

  engine: playwright

  headless: true

  actions:

    - {action: wait_ms, value: "1500"}

    - {action: scroll_bottom, times: 12, pause_ms: "1000"}

http: {respect_robots: true, delay_seconds: "1.0"}

extract: {mode: auto, fields: {}, review_low_confidence: true}

outputs: {jsonl: true, csv: true, xlsx: true}

template_version: 1

template:

  id: industries/news-articles

  name: 新闻与媒体文章

  category: industries/news

  description: 面向新闻类栏目，优先提取标题、作者、发布时间、正文和原始证据

  version: 1.0.0

  tags: [新闻, 媒体, 正文, 增量]

  capabilities: [crawl, auto-extraction, incremental, evidence, attachment-download]

  placeholders:

    channel_url: {label: 新闻栏目地址, required: true}

  html_contains: [article:published_time, NewsArticle, datePublished]

  verified_at: '2026-07-17'

project: {name: news_articles, workspace: work/news_articles}

source: {kind: incremental, seeds: ['{{channel_url}}']}

crawl:

  strategy: priority

  focus_keywords: [news, article, content, detail, 新闻, 资讯]

  max_pages: 2000

  max_depth: 4

  same_host: true

  concurrency: 6

http: {respect_robots: true, delay_seconds: 1.0, auto_browser_fallback: true}

extract: {mode: auto, fields: {}, quality_threshold: 0.82, review_low_confidence: true}

download: {enabled: true, extensions: [.pdf, .doc, .docx, .xls, .xlsx, .csv], media: false}

incremental: {skip_unchanged: true, archive_raw: true}

outputs: {jsonl: true, csv: true, xlsx: true}

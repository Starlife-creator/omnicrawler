template_version: 1

template:

  id: industries/forum-threads

  name: 论坛与社区主题

  category: industries/community

  description: 采集公开论坛帖子、楼层、作者和时间，不包含登录与验证码绕过

  version: 1.0.0

  tags: [论坛, 社区, 主题, 帖子]

  capabilities: [crawl, pagination, incremental, evidence]

  placeholders:

    forum_url: {label: 公开论坛版块地址, required: true}

  html_contains: [discussion, thread, post]

  verified_at: '2026-07-17'

project: {name: forum_threads, workspace: work/forum_threads}

source: {kind: incremental, seeds: ['{{forum_url}}']}

crawl: {strategy: priority, focus_keywords: [thread, topic, post, 主题, 帖子], max_pages: 5000, max_depth: 5, same_host: true, concurrency: 3}

http: {respect_robots: true, delay_seconds: 1.5, auto_browser_fallback: true}

extract: {mode: auto, fields: {}, quality_threshold: 0.8, review_low_confidence: true}

incremental: {skip_unchanged: true, archive_raw: true}

outputs: {jsonl: true, csv: true, xlsx: true}

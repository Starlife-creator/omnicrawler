template_version: 1

template:

  id: industries/real-estate

  name: 房地产公开房源

  category: industries/real-estate

  description: 获取公开房源标题、位置、面积、价格、户型和发布时间

  version: 1.0.0

  tags: [房产, 房源, 价格, 位置]

  capabilities: [crawl, offer-schema, incremental, evidence]

  placeholders:

    listing_url: {label: 公开房源列表地址, required: true}

  html_contains: [RealEstateListing, floorSize, addressLocality]

  verified_at: '2026-07-17'

project: {name: real_estate, workspace: work/real_estate}

source: {kind: incremental, seeds: ['{{listing_url}}']}

crawl: {strategy: priority, focus_keywords: [listing, house, property, 房源, 小区], max_pages: 5000, max_depth: 4, same_host: true, concurrency: 4}

http: {respect_robots: true, delay_seconds: 1.5, auto_browser_fallback: true}

extract: {mode: auto, fields: {}, quality_threshold: 0.82, review_low_confidence: true}

incremental: {skip_unchanged: true, archive_raw: true}

outputs: {jsonl: true, csv: true, xlsx: true}

template_version: 1

template:

  id: industries/academic-papers

  name: 学术论文与元数据

  category: industries/academic

  description: 采集公开论文的元数据、摘要与 DOI 链接，并按需下载论文附件

  version: 1.0.0

  tags: [学术, 论文, DOI, PDF]

  capabilities: [crawl, metadata, attachment-download, pdf, evidence]

  placeholders:

    listing_url: {label: 论文列表或检索地址, required: true}

  html_contains: [citation_title, citation_doi, citation_pdf_url]

  verified_at: '2026-07-17'

project: {name: academic_papers, workspace: work/academic_papers}

source: {kind: focused, seeds: ['{{listing_url}}']}

crawl: {strategy: priority, focus_keywords: [paper, article, doi, pdf, 论文], max_pages: 5000, max_depth: 4, same_host: false, concurrency: 4}

http: {respect_robots: true, delay_seconds: 1.5}

extract: {mode: auto, fields: {}, quality_threshold: 0.85, review_low_confidence: true}

download: {enabled: true, extensions: [.pdf], media: false}

outputs: {jsonl: true, csv: true, xlsx: true}
